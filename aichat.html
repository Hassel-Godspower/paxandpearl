<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Website AI Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      background: #111827;
      color: white;
      font-weight: 600;
      text-align: center;
    }

    .chatbox {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .message {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
    }

    .user span {
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      border-radius: 14px 14px 0 14px;
      display: inline-block;
      max-width: 80%;
    }

    .ai span {
      background: #e5e7eb;
      color: #111827;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 0;
      display: inline-block;
      max-width: 80%;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input input {
      flex: 1;
      padding: 14px;
      border: none;
      font-size: 15px;
      outline: none;
    }

    .chat-input button {
      padding: 0 20px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-input button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<div class="chat-container">
  <div class="chat-header">Ask this Website</div>

  <div id="chatbox" class="chatbox"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Ask something..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
async function send() {
  const input = document.getElementById("msg");
  const chatbox = document.getElementById("chatbox");
  const msg = input.value.trim();
  if (!msg) return;

  chatbox.innerHTML += `
    <div class="message user">
      <span>${msg}</span>
    </div>
  `;

  input.value = "";
  chatbox.scrollTop = chatbox.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();

    chatbox.innerHTML += `
      <div class="message ai">
        <span>${data.answer || "No response yet."}</span>
      </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;

  } catch (err) {
    chatbox.innerHTML += `
      <div class="message ai">
        <span>Error connecting to AI.</span>
      </div>
    `;
  }
}
</script>

</body>
</html>
