<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Website AI Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      background: #111827;
      color: white;
      font-weight: 600;
      text-align: center;
    }

    .chatbox {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .message {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .user { text-align: right; }
    .user span {
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      border-radius: 14px 14px 0 14px;
      display: inline-block;
      max-width: 80%;
    }

    .ai span {
      background: #e5e7eb;
      color: #111827;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 0;
      display: inline-block;
      max-width: 80%;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input input {
      flex: 1;
      padding: 14px;
      border: none;
      font-size: 15px;
      outline: none;
    }

    .chat-input button {
      padding: 0 20px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="chat-container">
  <div class="chat-header">Ask This Website</div>
  <div id="chatbox" class="chatbox"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Ask about this website..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const SITE_URL = window.location.origin;

// Initialize site indexing once
(async function init() {
  try {
    await fetch("/api/index", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: SITE_URL })
    });
  } catch (e) {
    console.warn("Indexing skipped or already done");
  }
})();

async function send() {
  const input = document.getElementById("msg");
  const chatbox = document.getElementById("chatbox");
  const question = input.value.trim();
  if (!question) return;

  chatbox.innerHTML += `
    <div class="message user"><span>${question}</span></div>
  `;
  input.value = "";
  chatbox.scrollTop = chatbox.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: SITE_URL,
        question
      })
    });

    const data = await res.json();

    chatbox.innerHTML += `
      <div class="message ai">
        <span>${data.answer || "I couldn't find that on this website."}</span>
      </div>
    `;
  } catch {
    chatbox.innerHTML += `
      <div class="message ai"><span>Server error.</span></div>
    `;
  }

  chatbox.scrollTop = chatbox.scrollHeight;
}
</script>

</body>
</html>
