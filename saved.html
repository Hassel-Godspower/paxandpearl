</div>

<style>
.container { padding-bottom: 90px; font-family: 'DM Sans', sans-serif; }
.card {
  background:#fff;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
</style>

<script>
const saved = JSON.parse(localStorage.getItem("saved") || "[]");
const list = document.getElementById("savedList");

if (!saved.length) {
  list.innerHTML = "<p>No saved services yet.</p>";
} else {
  saved.forEach(s => {
    list.innerHTML += `
      <div class="card">
        <strong>${s.name}</strong><br>
        ₦${s.price}
      </div>
    `;
  });
}
</script>

</body>
