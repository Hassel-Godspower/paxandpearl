<script>
/* ============================
   MOBILE NAV – ADMIN WHATSAPP
   (Public, GitHub-safe)
============================ */
(function bindAdminWhatsAppFromCatalog() {
  const msgBtn = document.getElementById("messageAdmin");
  if (!msgBtn) return;

  fetch("/catalog1.json")
    .then(res => {
      if (!res.ok) throw new Error("Catalog not found");
      return res.json();
    })
    .then(data => {
      const phone = data?.admin?.whatsapp;

      if (!phone) {
        throw new Error("Admin WhatsApp missing");
      }

      // Ensure digits only
      const cleanPhone = phone.replace(/\D/g, "");

      msgBtn.href = `https://wa.me/${cleanPhone}`;
      msgBtn.target = "_blank";
    })
    .catch(() => {
      msgBtn.href = "#";
      msgBtn.addEventListener("click", e => {
        e.preventDefault();
        alert("Admin WhatsApp not available yet.");
      });
    });
})();
</script>



<style>
  .container { padding-bottom: 90px; font-family: 'DM Sans', sans-serif; }
  .card {
    background:#fff;
    padding:14px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
  }

  .mobile-nav a:active {
    transform: scale(0.96);
  }

  @media (min-width: 768px) {
    .mobile-nav {
      display: none;
    }
  }
</style>

<script>
const saved = JSON.parse(localStorage.getItem("saved") || "[]");
const list = document.getElementById("savedList");

if (!saved.length) {
  list.innerHTML = "<p>No saved services yet.</p>";
} else {
  saved.forEach(s => {
    list.innerHTML += `
      <div class="card">
        <strong>${s.name}</strong><br>
        ₦${s.price}
      </div>
    `;
  });
}
</script>

</body>
