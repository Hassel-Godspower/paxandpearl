<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saved Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
</head>

<body>

<div class="container">
  <h2>Saved Services</h2>
  <div id="savedList"></div>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
  <a href="index.html"><span class="material-icons-round">home</span><small>Home</small></a>
  <a href="booking.html"><span class="material-icons-round">event</span><small>Booking</small></a>
  <a href="saved.html" class="active"><span class="material-icons-round">favorite</span><small>Saved</small></a>
  <a href="https://wa.me/234XXXXXXXXXX" target="_blank"><span class="material-icons-round">chat</span><small>Message</small></a>
  <a href="profile.html"><span class="material-icons-round">person</span><small>Profile</small></a>
</nav>

<style>
.container { padding-bottom: 90px; font-family: 'DM Sans', sans-serif; }
.card {
  background:#fff;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.mobile-nav {
  position:fixed; bottom:0; left:0; width:100%; height:64px;
  background:#fff; display:flex; border-top:1px solid #eee;
  font-family:'Poppins',sans-serif;
}
.mobile-nav a {
  flex:1; text-align:center; font-size:11px;
  text-decoration:none; color:#777;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.mobile-nav a.active { color:#7b5cff; }
@media (min-width:768px){ .mobile-nav{display:none;} }
</style>

<script>
const saved = JSON.parse(localStorage.getItem("saved") || "[]");
const list = document.getElementById("savedList");

if (!saved.length) {
  list.innerHTML = "<p>No saved services yet.</p>";
} else {
  saved.forEach(s => {
    list.innerHTML += `
      <div class="card">
        <strong>${s.name}</strong><br>
        ₦${s.price}
      </div>
    `;
  });
}
</script>

</body>
</html>
