<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saved Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="container">
  <h2>Saved Services</h2>
  <div id="savedList"></div>
</div>

<!-- MOBILE NAV -->
<!-- =========================
     MOBILE BOTTOM NAV
========================== -->
<nav class="mobile-nav">
  <a href="index.html">
    <span class="material-icons-round">home</span>
    <small>Home</small>
  </a>

  <a href="booking.html">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
  </a>

  <a href="saved.html" class="active">
    <span class="material-icons-round">favorite</span>
    <small>Saved</small>
  </a>

  <a href="#" id="messageAdmin">
    <span class="material-icons-round">chat</span>
    <small>Message</small>
  </a>
  
  <a href="profile.html">
    <span class="material-icons-round">person</span>
    <small>Profile</small>
  </a>
</nav>



<style>
  .container { padding-bottom: 90px; font-family: 'DM Sans', sans-serif; }
  .card {
    background:#fff;
    padding:14px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
  }

  .mobile-nav a:active {
    transform: scale(0.96);
  }

  @media (min-width: 768px) {
    .mobile-nav {
      display: none;
    }
  }
</style>

<script>
const saved = JSON.parse(localStorage.getItem("saved") || "[]");
const list = document.getElementById("savedList");

if (!saved.length) {
  list.innerHTML = "<p>No saved services yet.</p>";
} else {
  saved.forEach(s => {
    list.innerHTML += `
      <div class="card">
        <strong>${s.name}</strong><br>
        ₦${s.price}
      </div>
    `;
  });
}
</script>

<script>
  const adminProfile = JSON.parse(localStorage.getItem("adminProfile") || {});
  const msgBtn = document.getElementById("messageAdmin");

  if (msgBtn && adminProfile.phone) {
    msgBtn.href = `https://wa.me/${adminProfile.phone}`;
    msgBtn.target = "_blank";
  } else if (msgBtn) {
    msgBtn.addEventListener("click", () => {
      alert("Admin contact not available yet.");
    });
  }
</script>

</body>
</html>
