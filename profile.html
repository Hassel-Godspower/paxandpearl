<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up / Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style>
    body { font-family:'DM Sans',sans-serif; background:#fafafa; }
    .container { padding:20px 16px 90px; max-width:420px; margin:auto; }
    h2 { margin-bottom:12px; }
    input, button {
      width:100%; padding:12px; margin-bottom:12px;
      border-radius:10px; border:1px solid #ddd;
      font-size:14px;
    }
    button {
      background:#7b5cff; color:#fff;
      border:none; font-weight:600;
    }
    button:active { transform:scale(.98); }

    .divider {
      text-align:center;
      font-size:12px;
      color:#777;
      margin:14px 0;
    }

    .mobile-nav {
      position:fixed; bottom:0; left:0; width:100%; height:64px;
      display:flex; border-top:1px solid #eee; background:#fff;
    }
    .mobile-nav a {
      flex:1; text-align:center; font-size:11px; color:#777;
      text-decoration:none; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
    }
    .mobile-nav a.active { color:#7b5cff; }
    @media(min-width:768px){.mobile-nav{display:none;}}
  </style>
</head>

<body>

<div class="container">
  <h2>Create Account / Login</h2>

  <!-- USER SIGN UP -->
  <input id="name" placeholder="Full Name">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="WhatsApp Number">

  <button onclick="signupUser()">Continue</button>

  <div class="divider">Admin login</div>

  <!-- ADMIN LOGIN -->
  <input id="username" placeholder="Admin Username">
  <input id="password" type="password" placeholder="Admin Password">

  <button onclick="loginAdmin()">Login as Admin</button>
</div>

<nav class="mobile-nav">
  <a href="index.html"><span class="material-icons-round">home</span><small>Home</small></a>
  <a href="booking.html"><span class="material-icons-round">event</span><small>Booking</small></a>
  <a href="profile.html" class="active"><span class="material-icons-round">person</span><small>Profile</small></a>
</nav>

<script>
/* ============================
   ADMIN CREDENTIALS
============================ */
const ADMIN = { user: "admin", pass: "1234" };

/* ============================
   INPUT REFERENCES (IMPORTANT)
============================ */
const nameInput  = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");

const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");

/* ============================
   AUTO LOAD USER
============================ */
const userProfile = JSON.parse(localStorage.getItem("userProfile") || "{}");

if (userProfile.name) {
  nameInput.value  = userProfile.name;
  emailInput.value = userProfile.email || "";
  phoneInput.value = userProfile.phone || "";
}

/* ============================
   USER SIGN UP / LOGIN
============================ */
function signupUser() {
  const name  = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const email = emailInput.value.trim();

  if (name === "" || phone === "") {
    alert("Please enter at least your name and WhatsApp number.");
    return;
  }

  localStorage.setItem("userSession", "true");

  localStorage.setItem("userProfile", JSON.stringify({
    name,
    email,
    phone
  }));

  window.location.href = "index.html";
}

/* ============================
   ADMIN LOGIN
============================ */
function loginAdmin() {
  if (
    usernameInput.value === ADMIN.user &&
    passwordInput.value === ADMIN.pass
  ) {
    localStorage.setItem("adminSession", "true");

    localStorage.setItem("adminProfile", JSON.stringify({
      phone: phoneInput.value.trim()
    }));

    window.location.href = "admin-dashboard.html";
  } else {
    alert("Invalid admin credentials");
  }
}
</script>

</body>
</html>
