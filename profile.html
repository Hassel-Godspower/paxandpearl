<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up / Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
  <style>
    body { font-family:'DM Sans',sans-serif; background:#fafafa; }
    .container { padding:20px 16px 70px; max-width:400px; margin:auto; }
    h2 { margin-bottom:12px; }
    input, button {
      width:100%; padding:12px; margin-bottom:12px;
      border-radius:10px; border:1px solid #ddd;
      font-size:14px;
    }
    
    .divider {
      text-align:center;
      font-size:12px;
      color:#777;
      margin:14px 0;
    }
  </style>
  
</head>

<body>

<div class="container">
  <h2>Create Account / Login</h2>

  <!-- USER SIGN UP -->
  <input id="name" placeholder="Full Name">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="WhatsApp Number">

  <button class="btn btn-primary" onclick="signupUser()">Continue</button>
</div>

<!-- =========================
     MOBILE BOTTOM NAV
========================== -->
<nav class="mobile-nav">
  <a href="index.html">
    <span class="material-icons-round">home</span>
    <small>Home</small>
  </a>

  <a href="booking.html">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
  </a>

  <a href="saved.html">
    <span class="material-icons-round">favorite</span>
    <small>Saved</small>
  </a>

  <a href="https://wa.me/234XXXXXXXXXX" target="_blank">
    <span class="material-icons-round">chat</span>
    <small>Message</small>
  </a>

  <a href="profile.html" class="active">
    <span class="material-icons-round">person</span>
    <small>Profile</small>
  </a>
</nav>

<script>

/* ============================
   INPUT REFERENCES (IMPORTANT)
============================ */
const nameInput  = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");

/* ============================
   AUTO LOAD USER
============================ */
const userProfile = JSON.parse(localStorage.getItem("userProfile") || "{}");

if (userProfile.name) {
  nameInput.value  = userProfile.name;
  emailInput.value = userProfile.email || "";
  phoneInput.value = userProfile.phone || "";
}

/* ============================
   USER SIGN UP / LOGIN
============================ */
function signupUser() {
  const name  = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const email = emailInput.value.trim();

  if (name === "" || phone === "") {
    alert("Please enter at least your name and WhatsApp number.");
    return;
  }

  localStorage.setItem("userSession", "true");

  localStorage.setItem("userProfile", JSON.stringify({
    name,
    email,
    phone
  }));

  window.location.href = "index.html";
}
</script>

</body>
</html>
