<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Services | Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

  <!-- =========================
       PAGE CONTAINER
  ========================== -->
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">Select Services</div>
    </header>
    <!-- =========================
         CATEGORY FILTER
    ========================== -->
    <section class="category-filter">
      <button data-filter="all" class="active">All</button>
      <button data-filter="massage">Massage</button>
      <button data-filter="facials">Facials</button>
      <button data-filter="pedicure-manicure">Pedicure & Manicure</button>
      <button data-filter="steam-scrub">Steam & Scrub</button>
      <button data-filter="chemical-peel">Chemical Peel</button>
      <button data-filter="waxing">Waxing</button>
      <button data-filter="hammam">Hammam</button>
    </section>

    <!-- =========================
         SEARCH SERVICES
    ========================== -->
    <section class="search-section">
      <div class="search-box">
        <span class="material-icons-round">search</span>
        <input
          type="text"
          id="serviceSearch"
          placeholder="Search services..."
          autocomplete="off"
        />
      </div>
    </section>


    <!-- SERVICES LIST -->
    <section class="services-section">
      <h2>Select Services</h2>
      <div id="services" class="services"></div>
    </section>

  </div>

  <!-- =========================
       MOBILE BOTTOM NAV
  ========================== -->
  <nav class="mobile-nav">
    <a href="index.html" class="active">
      <span class="material-icons-round">home</span>
      <small>Home</small>
    </a>

    <a href="booking.html">
      <span class="material-icons-round">event</span>
      <small>Booking</small>
    </a>

    <a href="saved.html">
      <span class="material-icons-round">favorite</span>
      <small>Saved</small>
    </a>

    <a href="https://wa.me/234XXXXXXXXXX" target="_blank">
      <span class="material-icons-round">chat</span>
      <small>Message</small>
    </a>

    <a href="profile.html">
      <span class="material-icons-round">person</span>
      <small>Profile</small>
    </a>
  </nav>

  <!-- =========================
       INLINE NAV STYLES
  ========================== -->
  <style>
    .container {
      padding-bottom: 90px;
    }

    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #fff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #eee;
      z-index: 9999;
      font-family: 'Poppins', sans-serif;
    }

    .mobile-nav a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #777;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .mobile-nav .material-icons-round {
      font-size: 22px;
      line-height: 1;
    }

    .mobile-nav a.active {
      color: #7b5cff;
    }

    .mobile-nav a:active {
      transform: scale(0.96);
    }

    @media (min-width: 768px) {
      .mobile-nav {
        display: none;
      }
    }
  </style>

  <!-- =========================
       SCRIPTS
  ========================== -->

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialCategory = params.get("category") || "all";
  
    renderServices(initialCategory);
  
    document.querySelectorAll(".category-filter button").forEach(btn => {
      btn.addEventListener("click", () => {
        document
          .querySelectorAll(".category-filter button")
          .forEach(b => b.classList.remove("active"));
  
        btn.classList.add("active");
        renderServices(btn.dataset.filter);
      });
    });
  
    // Activate correct pill on load
    document.querySelectorAll(".category-filter button").forEach(btn => {
      if (btn.dataset.filter === initialCategory) {
        btn.classList.add("active");
      }
    });
  </script>

  <script>

  const servicesContainer = document.getElementById("services");

  function renderServices(category = "all") {
    servicesContainer.innerHTML = "";
  
    servicesData
      .filter(service => category === "all" || service.category === category)
      .forEach(service => {
        const div = document.createElement("div");
        div.className = "card service-card";
        div.dataset.category = service.category;
  
        div.innerHTML = `
          <h3>${service.name}</h3>
          <p>₦${service.price.toLocaleString()}</p>
          <button class="btn">Add to Booking</button>
        `;
  
        servicesContainer.appendChild(div);
      });
  }
  </script>
  
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>

</body>
</html>
