<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Services | Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Select Services</div>
  </header>

  <!-- FLOATING BOOKING CART -->
  <a href="booking.html" class="see-booking" id="seeBooking">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
    <span class="badge" id="bookingCount">0</span>
  </a>

  <!-- CATEGORY FILTER -->
  <section class="category-filter">
    <button data-filter="all" class="active">All</button>
    <button data-filter="massage">Massage</button>
    <button data-filter="facials">Facials</button>
    <button data-filter="pedicure-manicure">Pedicure & Manicure</button>
    <button data-filter="steam-scrub">Steam & Scrub</button>
    <button data-filter="chemical-peel">Chemical Peel</button>
    <button data-filter="waxing">Waxing</button>
    <button data-filter="hammam">Hammam</button>
  </section>

  <!-- SEARCH -->
  <section class="search-section">
    <div class="search-box">
      <span class="material-icons-round">search</span>
      <input
        type="text"
        id="serviceSearch"
        placeholder="Search services..."
        autocomplete="off"
      />
    </div>
  </section>

  <!-- SERVICES -->
  <section class="services-section">
    <h2>Select Services</h2>
    <div id="services" class="services"></div>
  </section>

</div>

<!-- =========================
     MOBILE BOTTOM NAV
========================== -->
<nav class="mobile-nav">
  <a href="index.html">
    <span class="material-icons-round">home</span>
    <small>Home</small>
  </a>

  <a href="booking.html">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
  </a>

  <a href="saved.html">
    <span class="material-icons-round">favorite</span>
    <small>Saved</small>
  </a>

  <a href="https://wa.me/234XXXXXXXXXX" target="_blank">
    <span class="material-icons-round">chat</span>
    <small>Message</small>
  </a>

  <a href="profile.html">
    <span class="material-icons-round">person</span>
    <small>Profile</small>
  </a>
</nav>
  
<!-- INLINE NAV STYLES -->
<style>
  .container { padding-bottom: 90px; }
  }
</style>

<!-- =========================
     SCRIPTS (ORDER MATTERS)
========================= -->

<script src="js/data.js"></script>
<script src="js/booking.js"></script>

<script>
  const servicesContainer = document.getElementById("services");
  const searchInput = document.getElementById("serviceSearch");
  const filterButtons = document.querySelectorAll(".category-filter button");

  let activeCategory = "all";
  let searchQuery = "";

  function renderServices() {
    if (!servicesContainer || !SPA_DATA) return;

    servicesContainer.innerHTML = "";

    SPA_DATA.services
      .filter(service => {
        const matchesCategory =
          activeCategory === "all" || service.category === activeCategory;

        const matchesSearch =
          service.name.toLowerCase().includes(searchQuery.toLowerCase());

        return matchesCategory && matchesSearch;
      })
      .forEach(service => {
        const card = document.createElement("div");
        card.className = "card service-card";

        card.innerHTML = `
          <h3>${service.name}</h3>
          <p><strong>₦${Number(service.price).toLocaleString()}</strong></p>
          <button class="btn add-btn">Add to Booking</button>
        `;

        card.querySelector(".add-btn").addEventListener("click", () => {
          addToCart({
            name: service.name,
            price: service.price
          });
          alert(`${service.name} added to booking`);
        });

        servicesContainer.appendChild(card);
      });
  }

  // Category filter
  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      filterButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.filter;
      renderServices();
    });
  });

  // Search
  searchInput.addEventListener("input", e => {
    searchQuery = e.target.value;
    renderServices();
  });

  // Category from URL (?category=massage)
  const params = new URLSearchParams(window.location.search);
  const urlCategory = params.get("category");

  if (urlCategory) {
    activeCategory = urlCategory;
    filterButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.filter === urlCategory);
    });
  }

  renderServices();
</script>

</body>
</html>
