<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Services | Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Select Services</div>
  </header>

  <!-- FLOATING BOOKING CART -->
  <a href="booking.html" class="see-booking" id="seeBooking">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
    <span class="badge" id="bookingCount">0</span>
  </a>


  <!-- SEARCH -->
  <section class="search-section">
    <div class="search-box">
      <span class="material-icons-round">search</span>
      <input
        type="text"
        id="serviceSearch"
        placeholder="Search services..."
        autocomplete="off"
      />
    </div>
  </section>

  <!-- SERVICES -->
  <section class="services-section">
    <h2>Select Services</h2>
    <div id="services" class="services"></div>
  </section>

</div>

<!-- =========================
     MOBILE BOTTOM NAV
========================== -->
<nav class="mobile-nav">
  <a href="index.html">
    <span class="material-icons-round">home</span>
    <small>Home</small>
  </a>

  <a href="booking.html">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
  </a>

  <a href="saved.html">
    <span class="material-icons-round">favorite</span>
    <small>Saved</small>
  </a>

  <a href="#" id="messageAdmin">
    <span class="material-icons-round">chat</span>
    <small>Message</small>
  </a>

  <a href="profile.html">
    <span class="material-icons-round">person</span>
    <small>Profile</small>
  </a>
</nav>
  
<!-- INLINE NAV STYLES -->
<style>
  .container { padding-bottom: 90px; }
  }
</style>

<!-- =========================
     SCRIPTS (ORDER MATTERS)
========================= -->

<script src="js/data.js"></script>
<script src="js/booking.js"></script>

<script>
const servicesContainer = document.getElementById("services");
const filterContainer = document.querySelector(".category-filter");
const searchInput = document.getElementById("serviceSearch");

const catalog =
  JSON.parse(localStorage.getItem("spaCatalog")) || {
    categories: [],
    services: []
  };

let activeCategory = "all";
let searchQuery = "";

/* ---------- Render Categories ---------- */
function renderCategories() {
  filterContainer.innerHTML = `<button data-filter="all" class="active">All</button>`;

  catalog.categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.dataset.filter = cat.id;
    btn.textContent = cat.name;
    filterContainer.appendChild(btn);
  });

  filterContainer.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      filterContainer.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.filter;
      renderServices();
    });
  });
}

/* ---------- Render Services ---------- */
function renderServices() {
  servicesContainer.innerHTML = "";

  catalog.services
    .filter(s =>
      (activeCategory === "all" || s.category === activeCategory) &&
      s.name.toLowerCase().includes(searchQuery.toLowerCase())
    )
    .forEach(service => {
      const card = document.createElement("div");
      card.className = "card service-card";

      card.innerHTML = `
        <h3>${service.name}</h3>
        <p><strong>₦${service.price.toLocaleString()}</strong></p>
        <button class="btn btn-primary">Add to Booking</button>
      `;

      card.querySelector("button").onclick = () => {
        addToCart({ name: service.name, price: service.price });
        alert(`${service.name} added`);
      };

      servicesContainer.appendChild(card);
    });
}

/* ---------- Search ---------- */
searchInput.addEventListener("input", e => {
  searchQuery = e.target.value;
  renderServices();
});

/* ---------- Init ---------- */
renderCategories();
renderServices();
</script>

  
<script>
  const adminProfile = JSON.parse(localStorage.getItem("adminProfile") || {});
  const msgBtn = document.getElementById("messageAdmin");

  if (msgBtn && adminProfile.phone) {
    msgBtn.href = `https://wa.me/${adminProfile.phone}`;
    msgBtn.target = "_blank";
  } else if (msgBtn) {
    msgBtn.addEventListener("click", () => {
      alert("Admin contact not available yet.");
    });
  }
</script>

</body>
</html>
