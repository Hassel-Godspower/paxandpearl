<script>
/* ============================
   MOBILE NAV – ADMIN WHATSAPP
   (Public, GitHub-safe)
============================ */
(function bindAdminWhatsAppFromCatalog() {
  const msgBtn = document.getElementById("messageAdmin");
  if (!msgBtn) return;

  fetch("/catalog1.json")
    .then(res => {
      if (!res.ok) throw new Error("Catalog not found");
      return res.json();
    })
    .then(data => {
      const phone = data?.admin?.whatsapp;

      if (!phone) {
        throw new Error("Admin WhatsApp missing");
      }

      // Ensure digits only
      const cleanPhone = phone.replace(/\D/g, "");

      msgBtn.href = `https://wa.me/${cleanPhone}`;
      msgBtn.target = "_blank";
    })
    .catch(() => {
      msgBtn.href = "#";
      msgBtn.addEventListener("click", e => {
        e.preventDefault();
        alert("Admin WhatsApp not available yet.");
      });
    });
})();
</script>

<style>.container{padding-bottom:90px;}</style>

<script>
/* ============================
   CONFIG
============================ */
const SERVICES_API =
  "https://script.google.com/macros/s/AKfycbx1ESSPs1EfhIGKm1q1FwirHHr1rgPYPrBxGqIPUnQQXXW6b96dWBsq1uer4i61k4Xd/exec";

/* ============================
   CART
============================ */
const CART_KEY = "spaBookingCart";
let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
const bookingCountEl = document.getElementById("bookingCount");

function updateBadge() {
  bookingCountEl.textContent = cart.length;
}

/* ============================
   SERVICES STATE
============================ */
const servicesContainer = document.getElementById("services");
const filterContainer = document.querySelector(".category-filter");
const searchInput = document.getElementById("serviceSearch");

let services = [];
let categories = {};
let activeCategory = "all";
let searchQuery = "";

/* ============================
   FETCH SERVICES FROM SHEET
============================ */
fetch(SERVICES_API)
  .then(res => res.json())
  .then(data => {
    services = data.map(s => ({
      id: s.id,
      name: s.name,
      description: s.description,
      price: Number(s.price),
      duration: Number(s.duration),
      category: s.category
    }));

    buildCategories();
    renderCategoryFilter();
    renderServices();
  })
  .catch(() => {
    servicesContainer.innerHTML =
      "<p class='empty'>Services unavailable at the moment.</p>";
  });

/* ============================
   BUILD CATEGORIES
============================ */
function buildCategories() {
  categories = {};
  services.forEach(s => {
    categories[s.category] = s.category.replace("-", " ");
  });
}

/* ============================
   CATEGORY FILTER
============================ */
function renderCategoryFilter() {
  filterContainer.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.textContent = "All";
  allBtn.className = "active";
  allBtn.onclick = () => setCategory("all", allBtn);
  filterContainer.appendChild(allBtn);

  Object.keys(categories).forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = categories[cat];
    btn.onclick = () => setCategory(cat, btn);
    filterContainer.appendChild(btn);
  });
}

function setCategory(cat, btn) {
  activeCategory = cat;
  filterContainer.querySelectorAll("button")
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderServices();
}

/* ============================
   RENDER SERVICES
============================ */
function renderServices() {
  servicesContainer.innerHTML = "";

  const filtered = services.filter(s => {
    const matchCat =
      activeCategory === "all" || s.category === activeCategory;
    const matchSearch =
      s.name.toLowerCase().includes(searchQuery) ||
      s.description.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  if (!filtered.length) {
    servicesContainer.innerHTML =
      "<p class='empty'>No services found.</p>";
    return;
  }

  filtered.forEach(service => {
    const card = document.createElement("div");
    card.className = "card service-card";

    card.innerHTML = `
      <h4>${service.name}</h4>
      <p>${service.description}</p>
      <p>
        <strong>₦${service.price.toLocaleString()}</strong><br>
        <small>${service.duration} mins</small>
      </p>
      <button class="btn btn-primary">Add to Booking</button>
    `;

    card.querySelector("button").onclick = () => {
      cart.push({
        id: service.id,
        name: service.name,
        price: service.price
      });
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateBadge();
      alert(`${service.name} added to booking`);
    };

    servicesContainer.appendChild(card);
  });
}

/* ============================
   SEARCH
============================ */
searchInput.addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase();
  renderServices();
});

/* INIT */
updateBadge();
</script>
</body>
