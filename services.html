<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Services | Pax & Pearl Body Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<!-- Existing Styles -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<!-- =====================================================
     SERVICES PAGE STYLING
===================================================== -->
<style>

:root {
  --services-bg: #f8f5ef;
  --services-card: #ffffff;
  --services-primary: #8b6f47;
  --services-primary-dark: #705735;
  --services-gold: #b8955a;
  --services-text: #29251f;
  --services-muted: #777168;
  --services-border: #e7e0d5;
  --services-soft: #f3eee6;
  --services-danger: #b64b4b;
  --services-shadow: 0 15px 45px rgba(65, 49, 30, 0.08);
  --services-radius: 18px;
}


/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;

  background:
    radial-gradient(
      circle at top right,
      rgba(184, 149, 90, 0.10),
      transparent 30%
    ),
    var(--services-bg);

  color: var(--services-text);
  font-family: "Poppins", sans-serif;
  min-height: 100vh;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {
  width: min(100% - 32px, 900px);
  margin: 0 auto;
  padding: 25px 0 120px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  display: flex;
  justify-content: center;
  align-items: center;

  padding: 15px 0 28px;
}

.logo {
  position: relative;

  font-family: "Montserrat", sans-serif;
  font-size: 22px;
  font-weight: 700;

  color: var(--services-text);
  letter-spacing: -0.4px;
}

.logo::after {
  content: "";

  display: block;

  width: 42px;
  height: 2px;

  margin: 8px auto 0;

  background: var(--services-gold);
  border-radius: 10px;
}


/* =====================================================
   FLOATING BOOKING BUTTON
===================================================== */

.see-booking {
  position: fixed;

  top: 20px;
  right: 20px;

  z-index: 900;

  min-width: 78px;
  height: 58px;

  padding: 7px 10px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 1px;

  text-decoration: none;

  background: rgba(255, 255, 255, 0.96);

  color: var(--services-primary-dark);

  border: 1px solid rgba(184, 149, 90, 0.20);
  border-radius: 15px;

  box-shadow:
    0 10px 30px rgba(50, 40, 25, 0.12);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.see-booking:hover {
  transform: translateY(-2px);

  box-shadow:
    0 14px 35px rgba(50, 40, 25, 0.16);
}

.see-booking .material-icons-round {
  font-size: 21px;
}

.see-booking small {
  font-size: 9px;
  font-weight: 600;
}


/* =====================================================
   BOOKING BADGE
===================================================== */

.badge {
  position: absolute;

  top: -7px;
  right: -7px;

  min-width: 22px;
  height: 22px;

  padding: 0 6px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--services-primary-dark);
  color: #fff;

  border: 2px solid #fff;
  border-radius: 50px;

  font-size: 10px;
  font-weight: 600;
}


/* =====================================================
   SEARCH SECTION
===================================================== */

.search-section {
  margin-bottom: 20px;
}

.search-box {
  position: relative;

  display: flex;
  align-items: center;

  width: 100%;
  height: 56px;

  background: var(--services-card);

  border: 1px solid var(--services-border);
  border-radius: 15px;

  box-shadow: var(--services-shadow);

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.search-box:focus-within {
  border-color: var(--services-gold);

  box-shadow:
    0 0 0 4px rgba(184, 149, 90, 0.10),
    var(--services-shadow);
}

.search-box .material-icons-round {
  margin-left: 18px;

  color: var(--services-muted);
  font-size: 22px;
}

.search-box input {
  flex: 1;

  height: 100%;

  padding: 0 18px 0 12px;

  border: 0;
  outline: 0;

  background: transparent;

  color: var(--services-text);

  font-family: "Poppins", sans-serif;
  font-size: 14px;
}

.search-box input::placeholder {
  color: #9a948b;
}


/* =====================================================
   CATEGORY FILTER
===================================================== */

.category-filter {
  display: flex;

  gap: 9px;

  margin-bottom: 28px;

  padding: 4px 2px;

  overflow-x: auto;

  scrollbar-width: none;

  -webkit-overflow-scrolling: touch;
}

.category-filter::-webkit-scrollbar {
  display: none;
}

.category-filter button {
  flex: 0 0 auto;

  min-height: 40px;

  padding: 8px 16px;

  border: 1px solid var(--services-border);
  border-radius: 50px;

  background: rgba(255, 255, 255, 0.75);

  color: var(--services-muted);

  font-family: "Poppins", sans-serif;
  font-size: 12px;
  font-weight: 500;

  cursor: pointer;

  transition:
    background 0.2s ease,
    color 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.category-filter button:hover {
  border-color: var(--services-gold);
  color: var(--services-primary-dark);
}

.category-filter button.active {
  background: var(--services-primary);

  border-color: var(--services-primary);

  color: #fff;

  box-shadow:
    0 6px 15px rgba(139, 111, 71, 0.18);
}


/* =====================================================
   SERVICES SECTION
===================================================== */

.services-section {
  margin-top: 10px;
}

.services-section h2 {
  margin: 0 0 18px;

  font-family: "Montserrat", sans-serif;

  font-size: 22px;
  font-weight: 700;

  color: var(--services-text);
}


/* =====================================================
   SERVICES GRID
===================================================== */

.services {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 16px;
}


/* =====================================================
   SERVICE CARD
===================================================== */

.service-card {
  position: relative;

  display: flex;
  flex-direction: column;

  min-height: 250px;

  padding: 22px;

  background: var(--services-card);

  border: 1px solid rgba(139, 111, 71, 0.10);
  border-radius: var(--services-radius);

  box-shadow: var(--services-shadow);

  overflow: hidden;

  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    border-color 0.22s ease;
}

.service-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 3px;

  background: linear-gradient(
    90deg,
    var(--services-gold),
    transparent
  );

  opacity: 0.75;
}

.service-card:hover {
  transform: translateY(-3px);

  border-color: rgba(184, 149, 90, 0.28);

  box-shadow:
    0 20px 45px rgba(65, 49, 30, 0.11);
}


/* =====================================================
   SERVICE TITLE
===================================================== */

.service-card h4 {
  margin: 0 0 9px;

  font-family: "Montserrat", sans-serif;

  font-size: 16px;
  line-height: 1.35;

  font-weight: 700;

  color: var(--services-text);
}


/* =====================================================
   SERVICE DESCRIPTION
===================================================== */

.service-card > p:first-of-type {
  margin: 0;

  color: var(--services-muted);

  font-size: 12px;
  line-height: 1.7;

  flex: 1;
}


/* =====================================================
   PRICE / DURATION
===================================================== */

.service-card > p:last-of-type {
  margin: 18px 0;

  padding-top: 15px;

  border-top: 1px solid var(--services-border);
}

.service-card > p:last-of-type strong {
  display: inline-block;

  margin-bottom: 4px;

  font-family: "Montserrat", sans-serif;

  font-size: 18px;
  font-weight: 700;

  color: var(--services-primary-dark);
}

.service-card > p:last-of-type small {
  color: var(--services-muted);

  font-size: 11px;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn {
  min-height: 46px;

  padding: 11px 16px;

  border-radius: 11px;
  border: 0;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-family: "Poppins", sans-serif;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}


/* =====================================================
   PRIMARY BUTTON
===================================================== */

.btn-primary {
  width: 100%;

  background: var(--services-primary);

  color: #fff;

  box-shadow:
    0 7px 18px rgba(139, 111, 71, 0.18);
}

.btn-primary:hover {
  background: var(--services-primary-dark);

  box-shadow:
    0 10px 24px rgba(112, 87, 53, 0.23);
}


/* =====================================================
   EMPTY / ERROR STATE
===================================================== */

.empty {
  grid-column: 1 / -1;

  margin: 5px 0;

  padding: 30px 20px;

  text-align: center;

  background: var(--services-card);

  border: 1px dashed var(--services-border);
  border-radius: 15px;

  color: var(--services-muted);

  font-size: 13px;
}


/* =====================================================
   MOBILE BOTTOM NAV
===================================================== */

.mobile-nav {
  position: fixed;

  z-index: 1000;

  bottom: 0;
  left: 50%;

  transform: translateX(-50%);

  width: min(100%, 900px);
  height: 72px;

  padding: 7px 10px;

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  align-items: center;

  background:
    rgba(255, 255, 255, 0.96);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border-top:
    1px solid rgba(139, 111, 71, 0.12);

  box-shadow:
    0 -8px 30px rgba(50, 40, 25, 0.08);
}

.mobile-nav a {
  height: 58px;

  border-radius: 12px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 2px;

  color: #8a8379;

  text-decoration: none;

  transition:
    color 0.2s ease,
    background 0.2s ease,
    transform 0.2s ease;
}

.mobile-nav a:hover {
  color: var(--services-primary);
}

.mobile-nav a.active {
  color: var(--services-primary-dark);

  background:
    rgba(184, 149, 90, 0.10);
}

.mobile-nav .material-icons-round {
  font-size: 22px;
}

.mobile-nav small {
  font-size: 10px;
  font-weight: 500;
}


/* =====================================================
   TABLET
===================================================== */

@media (min-width: 768px) {

  .container {
    padding-top: 40px;
  }

  .header {
    padding-bottom: 35px;
  }

  .services {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

  .service-card {
    min-height: 275px;
  }

  .mobile-nav {
    bottom: 18px;

    width: min(calc(100% - 40px), 700px);

    border:
      1px solid rgba(139, 111, 71, 0.12);

    border-radius: 18px;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 600px) {

  .container {
    width: min(100% - 20px, 900px);

    padding-top: 18px;
  }

  .header {
    padding-bottom: 25px;
  }

  .logo {
    font-size: 20px;
  }

  .see-booking {
    top: 13px;
    right: 10px;

    min-width: 66px;
    height: 52px;

    border-radius: 13px;
  }

  .see-booking .material-icons-round {
    font-size: 19px;
  }

  .search-box {
    height: 52px;
  }

  .services {
    grid-template-columns: 1fr;

    gap: 13px;
  }

  .service-card {
    min-height: auto;

    padding: 20px;
  }

  .service-card h4 {
    font-size: 15px;
  }

  .service-card > p:first-of-type {
    font-size: 12px;
  }

  .services-section h2 {
    font-size: 20px;
  }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

  .container {
    width: min(100% - 16px, 900px);
  }

  .see-booking {
    top: 10px;
    right: 8px;

    min-width: 60px;
    height: 49px;
  }

  .see-booking small {
    font-size: 8px;
  }

  .category-filter button {
    padding: 8px 13px;
  }

  .service-card {
    padding: 18px;
  }

  .mobile-nav {
    height: 68px;
  }

  .mobile-nav a {
    height: 54px;
  }

  .mobile-nav .material-icons-round {
    font-size: 21px;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- =================================================
       HEADER
  ================================================== -->

  <header class="header">
    <div class="logo">Select Services</div>
  </header>


  <!-- =================================================
       FLOATING BOOKING CART
  ================================================== -->

  <a href="booking.html" class="see-booking">

    <span class="material-icons-round">
      event
    </span>

    <small>Booking</small>

    <span
      class="badge"
      id="bookingCount"
    >
      0
    </span>

  </a>


  <!-- =================================================
       SEARCH
  ================================================== -->

  <section class="search-section">

    <div class="search-box">

      <span class="material-icons-round">
        search
      </span>

      <input
        type="text"
        id="serviceSearch"
        placeholder="Search services..."
        autocomplete="off"
      >

    </div>

  </section>


  <!-- =================================================
       CATEGORY FILTER
  ================================================== -->

  <section class="category-filter"></section>


  <!-- =================================================
       SERVICES
  ================================================== -->

  <section class="services-section">

    <h2>Select Services</h2>

    <div
      id="services"
      class="services"
    ></div>

  </section>

</div>


<!-- =====================================================
     MOBILE BOTTOM NAV
====================================================== -->

<nav class="mobile-nav">

  <a href="index.html" class="active">

    <span class="material-icons-round">
      home
    </span>

    <small>Home</small>

  </a>


  <a href="booking.html">

    <span class="material-icons-round">
      event
    </span>

    <small>Booking</small>

  </a>


  <a href="services.html">

    <span class="material-icons-round">
      favorite
    </span>

    <small>Services</small>

  </a>


  <a id="messageAdmin" href="#">

    <span class="material-icons-round">
      chat
    </span>

    <small>Message</small>

  </a>


  <a href="profile.html">

    <span class="material-icons-round">
      person
    </span>

    <small>Profile</small>

  </a>

</nav>


<script>

/* =====================================================
   MOBILE NAV – ADMIN WHATSAPP
===================================================== */

(function bindAdminWhatsAppFromCatalog() {

  const msgBtn =
    document.getElementById("messageAdmin");

  if (!msgBtn) return;

  fetch("/catalog1.json")

    .then(res => {

      if (!res.ok) {
        throw new Error(
          "Catalog not found"
        );
      }

      return res.json();

    })

    .then(data => {

      const phone =
        data?.admin?.whatsapp;

      if (!phone) {

        throw new Error(
          "Admin WhatsApp missing"
        );

      }

      const cleanPhone =
        phone.replace(/\D/g, "");

      msgBtn.href =
        `https://wa.me/${cleanPhone}`;

      msgBtn.target = "_blank";

    })

    .catch(() => {

      msgBtn.href = "#";

      msgBtn.addEventListener(
        "click",
        e => {

          e.preventDefault();

          alert(
            "Admin WhatsApp not available yet."
          );

        }
      );

    });

})();


/* =====================================================
   CONFIG
===================================================== */

const SERVICES_API =
  "https://script.google.com/macros/s/AKfycbx1ESSPs1EfhIGKm1q1FwirHHr1rgPYPrBxGqIPUnQQXXW6b96dWBsq1uer4i61k4Xd/exec";


/* =====================================================
   CART
===================================================== */

const CART_KEY =
  "spaBookingCart";

let cart =
  JSON.parse(
    localStorage.getItem(CART_KEY)
  ) || [];

const bookingCountEl =
  document.getElementById(
    "bookingCount"
  );


function updateBadge() {

  bookingCountEl.textContent =
    cart.length;

}


/* =====================================================
   SERVICES STATE
===================================================== */

const servicesContainer =
  document.getElementById(
    "services"
  );

const filterContainer =
  document.querySelector(
    ".category-filter"
  );

const searchInput =
  document.getElementById(
    "serviceSearch"
  );


let services = [];

let categories = {};

let activeCategory = "all";

let searchQuery = "";


/* =====================================================
   FETCH SERVICES FROM GOOGLE SHEET
===================================================== */

fetch(SERVICES_API)

  .then(res => {

    if (!res.ok) {
      throw new Error(
        "Services API unavailable"
      );
    }

    return res.json();

  })

  .then(data => {

    services =
      data.map(s => ({

        id: s.id,

        name: s.name,

        description:
          s.description,

        price:
          Number(s.price),

        duration:
          Number(s.duration),

        category:
          s.category

      }));

    buildCategories();

    renderCategoryFilter();

    renderServices();

  })

  .catch(error => {

    console.error(
      "Failed to load services:",
      error
    );

    servicesContainer.innerHTML =
      `
        <p class="empty">
          Services unavailable at the moment.
          Please try again shortly.
        </p>
      `;

  });


/* =====================================================
   BUILD CATEGORIES
===================================================== */

function buildCategories() {

  categories = {};

  services.forEach(s => {

    categories[s.category] =
      s.category
        .replace(/-/g, " ");

  });

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function renderCategoryFilter() {

  filterContainer.innerHTML = "";


  /* ALL */

  const allBtn =
    document.createElement(
      "button"
    );

  allBtn.textContent = "All";

  allBtn.className = "active";

  allBtn.onclick = () =>
    setCategory(
      "all",
      allBtn
    );

  filterContainer.appendChild(
    allBtn
  );


  /* OTHER CATEGORIES */

  Object.keys(categories)
    .forEach(cat => {

      const btn =
        document.createElement(
          "button"
        );

      btn.textContent =
        categories[cat];

      btn.onclick = () =>
        setCategory(
          cat,
          btn
        );

      filterContainer.appendChild(
        btn
      );

    });

}


function setCategory(cat, btn) {

  activeCategory = cat;

  filterContainer
    .querySelectorAll("button")
    .forEach(b =>
      b.classList.remove(
        "active"
      )
    );

  btn.classList.add("active");

  renderServices();

}


/* =====================================================
   RENDER SERVICES
===================================================== */

function renderServices() {

  servicesContainer.innerHTML = "";


  const filtered =
    services.filter(s => {

      const matchCat =
        activeCategory === "all" ||
        s.category ===
          activeCategory;


      const name =
        String(s.name || "")
          .toLowerCase();


      const description =
        String(
          s.description || ""
        ).toLowerCase();


      const matchSearch =
        name.includes(
          searchQuery
        ) ||
        description.includes(
          searchQuery
        );


      return (
        matchCat &&
        matchSearch
      );

    });


  if (!filtered.length) {

    servicesContainer.innerHTML =
      `
        <p class="empty">
          No services found.
        </p>
      `;

    return;

  }


  filtered.forEach(service => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "card service-card";


    card.innerHTML = `

      <h4>
        ${service.name}
      </h4>

      <p>
        ${service.description}
      </p>

      <p>

        <strong>
          ₦${service.price.toLocaleString()}
        </strong>

        <br>

        <small>
          ${service.duration} mins
        </small>

      </p>

      <button
        class="btn btn-primary"
        type="button"
      >
        Add to Booking
      </button>

    `;


    card
      .querySelector("button")
      .onclick = () => {

        cart.push({

          id:
            service.id,

          name:
            service.name,

          price:
            service.price

        });


        localStorage.setItem(
          CART_KEY,
          JSON.stringify(cart)
        );


        updateBadge();


        alert(
          `${service.name} added to booking`
        );

      };


    servicesContainer.appendChild(
      card
    );

  });

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  e => {

    searchQuery =
      e.target.value
        .toLowerCase()
        .trim();

    renderServices();

  }
);


/* =====================================================
   INIT
===================================================== */

updateBadge();

</script>

</body>
</html>
