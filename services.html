<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Services | Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Select Services</div>
  </header>

  <!-- FLOATING BOOKING CART -->
  <a href="booking.html" class="see-booking">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
    <span class="badge" id="bookingCount">0</span>
  </a>

  <!-- SEARCH -->
  <section class="search-section">
    <div class="search-box">
      <span class="material-icons-round">search</span>
      <input
        type="text"
        id="serviceSearch"
        placeholder="Search services..."
        autocomplete="off"
      />
    </div>
  </section>

  <!-- CATEGORY FILTER -->
  <section class="category-filter"></section>

  <!-- SERVICES -->
  <section class="services-section">
    <h2>Select Services</h2>
    <div id="services" class="services"></div>
  </section>

</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
  <a href="index.html">
    <span class="material-icons-round">home</span>
    <small>Home</small>
  </a>

  <a href="booking.html">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
  </a>

  <a href="saved.html">
    <span class="material-icons-round">favorite</span>
    <small>Saved</small>
  </a>

  <a href="#" id="messageAdmin">
    <span class="material-icons-round">chat</span>
    <small>Message</small>
  </a>

  <a href="profile.html">
    <span class="material-icons-round">person</span>
    <small>Profile</small>
  </a>
</nav>

<style>
  .container { padding-bottom: 90px; }
</style>

<!-- CORE SCRIPTS -->

<script src="js/data.js"></script>
<script src="js/booking.js"></script>

<script>
const servicesContainer = document.getElementById("services");
const filterContainer = document.querySelector(".category-filter");
const searchInput = document.getElementById("serviceSearch");

let catalog = { categories: [], services: [] };
let activeCategory = "all";
let searchQuery = "";

/* ============================
   LOAD CATALOG (STATIC FILE)
============================ */
fetch("/catalog.json")
  .then(res => {
    if (!res.ok) throw new Error("Catalog missing");
    return res.json();
  })
  .then(data => {
    catalog = data;
    renderCategoryFilter();
    renderServices();
  })
  .catch(err => {
    console.error(err);
    servicesContainer.innerHTML =
      "<p class='empty'>Services are currently unavailable.</p>";
  });

/* ============================
   CATEGORY FILTER
============================ */
function renderCategoryFilter() {
  filterContainer.innerHTML = "";

  // All button
  const allBtn = document.createElement("button");
  allBtn.textContent = "All";
  allBtn.className = "active";
  allBtn.onclick = () => {
    activeCategory = "all";
    setActiveFilter(allBtn);
    renderServices();
  };
  filterContainer.appendChild(allBtn);

  catalog.categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat.name;
    btn.onclick = () => {
      activeCategory = cat.id;
      setActiveFilter(btn);
      renderServices();
    };
    filterContainer.appendChild(btn);
  });
}

function setActiveFilter(activeBtn) {
  filterContainer
    .querySelectorAll("button")
    .forEach(b => b.classList.remove("active"));
  activeBtn.classList.add("active");
}

/* MUST MATCH booking.js */
const CART_KEY = "bookingCart";

/* =========================
   CART HELPERS
========================= */
function getCart() {
  return JSON.parse(localStorage.getItem(CART_KEY)) || [];
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const badge = document.getElementById("bookingCount");
  if (badge) badge.textContent = getCart().length;
}

/* =========================
   ADD TO BOOKING
========================= */
function addToBooking(service) {
  const cart = getCart();

  cart.push({
    id: service.id || Date.now(),
    name: service.name,
    description: service.description || "",
    price: Number(service.price),
    category: service.category || "",
    duration: service.duration || 0
  });

  saveCart(cart);

  // Optional feedback
  alert(`${service.name} added to booking`);
}

/* =========================
   RENDER SERVICES
   (example usage)
========================= */
function renderServices(services) {
  const container = document.getElementById("services");
  if (!container) return;

  container.innerHTML = "";

  services.forEach(service => {
    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="service-card">
        <h4>${service.name}</h4>
        <p>${service.description || ""}</p>
        <div><strong>₦${Number(service.price).toLocaleString()}</strong></div>
        <small>Duration: ${service.duration} mins</small>
        <br>
        <button class="btn btn-primary"
          onclick='addToBooking(${JSON.stringify(service)})'>
          Add to Booking
        </button>
      </div>
      `
    );
  });
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", () => {
  updateCartBadge();

  // Example: load services from storage
  const services =
    JSON.parse(localStorage.getItem("services") || "[]");

  renderServices(services);
});
</script>



<!-- ADMIN WHATSAPP -->
<script>
const adminProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
const msgBtn = document.getElementById("messageAdmin");

if (msgBtn && adminProfile.phone) {
  msgBtn.href = `https://wa.me/${adminProfile.phone}`;
  msgBtn.target = "_blank";
} else if (msgBtn) {
  msgBtn.onclick = () => alert("Admin contact not available yet.");
}
</script>

</body>
</html>
