<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Booking | Pax & Pearl Body Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container">

  <header class="header"><div class="logo">Your Booking</div></header>

  <!-- CART SUMMARY -->
  <section class="booking-summary">
    <h2>Your Booking</h2>
    <div id="cartItems" class="cart-items"></div>
    <div class="total-row"><span>Total</span><strong id="total">₦0</strong></div>
  </section>

  <!-- CUSTOMER DETAILS -->
  <section class="booking-form">
    <h3>Your Details</h3>
    <input id="name" type="text" placeholder="Full Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="phone" type="tel" placeholder="WhatsApp Number" required>
    <div class="datetime-row">
      <input id="date" type="date" required>
      <input id="time" type="time" required>
    </div>
    <button class="btn btn-primary" onclick="confirmBooking()">Book Now</button>
    <p class="note">*Booking time subject to admin confirmation</p>
  </section>

</div>

<!-- =========================
     MOBILE BOTTOM NAV
========================== -->
<nav class="mobile-nav">

    <span class="material-icons-round">chat</span>

  </a>

<script>
/* ============================
   MOBILE NAV – ADMIN WHATSAPP
   (Public, GitHub-safe)
============================ */
(function bindAdminWhatsAppFromCatalog() {
  const msgBtn = document.getElementById("messageAdmin");
  if (!msgBtn) return;

  fetch("/catalog1.json")
    .then(res => {
      if (!res.ok) throw new Error("Catalog not found");
      return res.json();
    })
    .then(data => {
      const phone = data?.admin?.whatsapp;

      if (!phone) {
        throw new Error("Admin WhatsApp missing");
      }

      // Ensure digits only
      const cleanPhone = phone.replace(/\D/g, "");

      msgBtn.href = `https://wa.me/${cleanPhone}`;
      msgBtn.target = "_blank";
    })
    .catch(() => {
      msgBtn.href = "#";
      msgBtn.addEventListener("click", e => {
        e.preventDefault();
        alert("Admin WhatsApp not available yet.");
      });
    });
})();
</script>

<style>.container{padding-bottom:90px;}</style>

<script>
function isSafariBrowser() {
  const ua = navigator.userAgent;
  return (
    ua.includes("Safari") &&
    !ua.includes("Chrome") &&
    !ua.includes("Android")
  );
}
</script>

<script>
function showSafariSendButton(booking) {
  const existing = document.getElementById("safariSendWrap");
  if (existing) existing.remove();

  const wrapper = document.createElement("div");
  wrapper.id = "safariSendWrap";
  wrapper.style.marginTop = "16px";

  const btn = document.createElement("button");
  btn.className = "btn btn-primary";
  btn.textContent = "Send Booking to Admin";
  btn.onclick = () => notifyAdminImmediately(booking);

  const note = document.createElement("p");
  note.style.fontSize = "13px";
  note.style.opacity = "0.7";
  note.textContent = "Tap to notify admin on WhatsApp";

  wrapper.appendChild(btn);
  wrapper.appendChild(note);

  document.querySelector(".booking-form").appendChild(wrapper);
}
</script>

<script>
const CART_KEY = "spaBookingCart";
let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];

const cartItemsEl = document.getElementById("cartItems");
const totalEl = document.getElementById("total");

/* RENDER CART */
function renderCart() {
  cartItemsEl.innerHTML = "";
  if (!cart.length) {
    cartItemsEl.innerHTML = "<p class='empty'>No services selected yet.</p>";
    totalEl.textContent = "₦0";
    return;
  }

  let total = 0;
  cart.forEach(item => {
    total += item.price;
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `<span>${item.name}</span><strong>₦${item.price.toLocaleString()}</strong>`;
    cartItemsEl.appendChild(row);
  });

  totalEl.textContent = "₦" + total.toLocaleString();
}
  

const GOOGLE_SHEETS_URL =
  "https://script.google.com/macros/s/AKfycbzFPP1YZhXqaiGIUhMyrzfjpnAC4ngLvv4zG7hr562EOFCLnlJeqHWScnM4ksvGbT_AvA/exec";

/* =========================
   GLOBAL ADMIN CATALOG
========================= */
let PUBLIC_CATALOG = {
  admin: {
    whatsapp: null
  }
};

/* =========================
   LOAD ADMIN WHATSAPP
========================= */
fetch("/catalog1.json")
  .then(res => res.json())
  .then(data => {
    if (data?.admin?.whatsapp) {
      // sanitize phone (digits only)
      PUBLIC_CATALOG.admin.whatsapp = data.admin.whatsapp.replace(/\D/g, "");

      // bind bottom nav button
      const msgBtn = document.getElementById("messageAdmin");
      if (msgBtn) {
        msgBtn.href = `https://wa.me/${PUBLIC_CATALOG.admin.whatsapp}`;
        msgBtn.target = "_blank";
      }
    }
  })
  .catch(() => {
    console.warn("catalog1.json not found or invalid");
  });

/* =========================
   WHATSAPP NOTIFY ADMIN
========================= */
function notifyAdmin(booking) {
  const phone = PUBLIC_CATALOG.admin.whatsapp;

  if (!phone) {
    alert("Admin WhatsApp not available yet. Please try again.");
    return;
  }

  const message = `
📅 NEW BOOKING ALERT

👤 Name: ${booking.customer.name}
📞 Phone: ${booking.customer.phone}
📧 Email: ${booking.customer.email}

🧖 Services:
${booking.services}

🗓 Date: ${booking.date}
⏰ Time: ${booking.time}

💰 Total: ₦${booking.total.toLocaleString()}
`;

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}

/* =========================
   CONFIRM BOOKING
========================= */
function confirmBooking() {
  if (!cart.length) {
    alert("Please select at least one service.");
    return;
  }

  const name = getValue("name");
  const email = getValue("email");
  const phone = getValue("phone");
  const date = getValue("date");
  const time = getValue("time");

  if (!name || !email || !phone || !date || !time) {
    alert("Fill all booking details.");
    return;
  }

  const total = cart.reduce((sum, item) => sum + item.price, 0);

  const booking = {
    id: "bk_" + Date.now(),
    customer: { name, email, phone },
    services: cart.map(s => s.name).join(", "),
    date,
    time,
    total,
    status: "submitted",
    createdAt: new Date().toISOString()
  };

  /* SAVE LOCALLY */
  const bookings = JSON.parse(localStorage.getItem("spaBookings") || "[]");
  bookings.push(booking);
  localStorage.setItem("spaBookings", JSON.stringify(bookings));

  /* SEND TO GOOGLE SHEETS */
  fetch(GOOGLE_SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name,
      email,
      phone,
      services: booking.services,
      date,
      time,
      total
    })
  })
  .then(res => res.json())
  .then(res => {
    if (!res.success) console.error("Sheets error:", res.error);
  })
  .catch(err => console.error("Sheets error:", err));

  /* CLEAR CART */
  cart = [];
  localStorage.removeItem(CART_KEY);
  renderCart();

  alert("Booking submitted successfully ✅");

  /* WHATSAPP ADMIN */
  if (PUBLIC_CATALOG.admin.whatsapp) {
    notifyAdmin(booking);
  }
}

/* =========================
   HELPERS
========================= */
function getValue(id) {
  return document.getElementById(id)?.value.trim() || "";
}

/* INIT */
renderCart();
</script>

  
</body>
</html>
