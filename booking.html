<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Booking | Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Existing Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Booking Page Styling -->
  <style>

    /* =========================================
       BOOKING PAGE
    ========================================= */

    :root {
      --booking-bg: #f8f5ef;
      --booking-card: #ffffff;
      --booking-primary: #8b6f47;
      --booking-primary-dark: #705735;
      --booking-gold: #b8955a;
      --booking-text: #29251f;
      --booking-muted: #777168;
      --booking-border: #e7e0d5;
      --booking-soft: #f3eee6;
      --booking-danger: #b64b4b;
      --booking-shadow: 0 15px 45px rgba(65, 49, 30, 0.08);
      --booking-radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(
          circle at top right,
          rgba(184, 149, 90, 0.10),
          transparent 30%
        ),
        var(--booking-bg);
      color: var(--booking-text);
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
    }

    /* =========================================
       MAIN CONTAINER
    ========================================= */

    .container {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 25px 0 110px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 0 30px;
    }

    .logo {
      font-family: "Montserrat", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--booking-text);
      position: relative;
    }

    .logo::after {
      content: "";
      display: block;
      width: 42px;
      height: 2px;
      margin: 8px auto 0;
      background: var(--booking-gold);
      border-radius: 10px;
    }

    /* =========================================
       GENERAL CARD
    ========================================= */

    .booking-summary,
    .booking-form {
      background: var(--booking-card);
      border: 1px solid rgba(139, 111, 71, 0.10);
      border-radius: var(--booking-radius);
      box-shadow: var(--booking-shadow);
    }

    /* =========================================
       BOOKING SUMMARY
    ========================================= */

    .booking-summary {
      padding: 28px;
      margin-bottom: 20px;
    }

    .booking-summary h2,
    .booking-form h3 {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      color: var(--booking-text);
    }

    .booking-summary h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    /* =========================================
       CART
    ========================================= */

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 16px;
      background: var(--booking-soft);
      border: 1px solid var(--booking-border);
      border-radius: 13px;
      transition: all 0.2s ease;
    }

    .cart-item:hover {
      transform: translateY(-1px);
      border-color: rgba(184, 149, 90, 0.35);
    }

    .cart-left {
      min-width: 0;
    }

    .cart-left span {
      display: block;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
    }

    .cart-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .cart-right strong {
      font-size: 14px;
      color: var(--booking-primary-dark);
      white-space: nowrap;
    }

    /* =========================================
       REMOVE BUTTON
    ========================================= */

    .remove-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: var(--booking-danger);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .remove-btn:hover {
      background: var(--booking-danger);
      color: #fff;
      transform: scale(1.05);
    }

    .remove-btn .material-icons-round {
      font-size: 18px;
    }

    /* =========================================
       EMPTY CART
    ========================================= */

    .empty {
      text-align: center;
      color: var(--booking-muted);
      background: var(--booking-soft);
      border: 1px dashed var(--booking-border);
      border-radius: 13px;
      padding: 25px 15px;
      margin: 0;
      font-size: 14px;
    }

    /* =========================================
       ADD MORE SERVICES
    ========================================= */

    .add-more-wrap {
      margin-top: 18px;
    }

    .btn {
      min-height: 48px;
      border-radius: 12px;
      padding: 12px 18px;
      border: none;
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn .material-icons-round {
      font-size: 20px;
    }

    .btn-outline {
      width: 100%;
      background: transparent;
      color: var(--booking-primary-dark);
      border: 1px solid var(--booking-border);
    }

    .btn-outline:hover {
      background: var(--booking-soft);
      border-color: var(--booking-gold);
    }

    /* =========================================
       TOTAL
    ========================================= */

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--booking-border);
    }

    .total-row span {
      font-size: 14px;
      color: var(--booking-muted);
      font-weight: 500;
    }

    .total-row strong {
      font-family: "Montserrat", sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--booking-primary-dark);
    }

    /* =========================================
       BOOKING FORM
    ========================================= */

    .booking-form {
      padding: 28px;
    }

    .booking-form h3 {
      font-size: 20px;
      margin-bottom: 22px;
    }

    /* =========================================
       INPUTS
    ========================================= */

    .booking-form input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      margin-bottom: 13px;
      border: 1px solid var(--booking-border);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--booking-text);
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .booking-form input::placeholder {
      color: #9a948b;
    }

    .booking-form input:focus {
      border-color: var(--booking-gold);
      background: #fffdf9;
      box-shadow: 0 0 0 4px rgba(184, 149, 90, 0.10);
    }

    /* =========================================
       DATE & TIME
    ========================================= */

    .datetime-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .datetime-row input {
      margin-bottom: 18px;
    }

    /* =========================================
       PRIMARY BUTTON
    ========================================= */

    .btn-primary {
      width: 100%;
      background: var(--booking-primary);
      color: #fff;
      box-shadow: 0 8px 20px rgba(139, 111, 71, 0.20);
    }

    .btn-primary:hover {
      background: var(--booking-primary-dark);
      box-shadow: 0 10px 25px rgba(112, 87, 53, 0.25);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* =========================================
       NOTE
    ========================================= */

    .note {
      margin: 14px 0 0;
      text-align: center;
      color: var(--booking-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================================
       MOBILE BOTTOM NAV
    ========================================= */

    .mobile-nav {
      position: fixed;
      z-index: 1000;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, 760px);
      height: 72px;
      padding: 7px 10px;

      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;

      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-top: 1px solid rgba(139, 111, 71, 0.12);
      box-shadow: 0 -8px 30px rgba(50, 40, 25, 0.08);
    }

    .mobile-nav a {
      height: 58px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;

      color: #8a8379;
      text-decoration: none;

      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .mobile-nav a:hover {
      color: var(--booking-primary);
    }

    .mobile-nav a.active {
      color: var(--booking-primary-dark);
      background: rgba(184, 149, 90, 0.10);
    }

    .mobile-nav .material-icons-round {
      font-size: 22px;
    }

    .mobile-nav small {
      font-family: "Poppins", sans-serif;
      font-size: 10px;
      font-weight: 500;
    }

    /* =========================================
       SAFARI SEND BUTTON
    ========================================= */

    #safariSendWrap {
      margin-top: 16px;
    }

    #safariSendWrap .note {
      font-size: 13px;
    }

    /* =========================================
       TABLET / DESKTOP
    ========================================= */

    @media (min-width: 768px) {

      .container {
        padding-top: 45px;
      }

      .header {
        padding-bottom: 35px;
      }

      .booking-summary,
      .booking-form {
        padding: 34px;
      }

      .mobile-nav {
        bottom: 18px;
        border: 1px solid rgba(139, 111, 71, 0.12);
        border-radius: 18px;
        width: min(calc(100% - 40px), 700px);
      }
    }

    /* =========================================
       SMALL PHONES
    ========================================= */

    @media (max-width: 480px) {

      .container {
        width: min(100% - 20px, 760px);
        padding-top: 18px;
      }

      .booking-summary,
      .booking-form {
        padding: 20px;
        border-radius: 16px;
      }

      .booking-summary h2 {
        font-size: 20px;
      }

      .booking-form h3 {
        font-size: 18px;
      }

      .cart-item {
        align-items: flex-start;
      }

      .cart-right {
        gap: 7px;
      }

      .cart-right strong {
        font-size: 13px;
      }

      .datetime-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .datetime-row input {
        margin-bottom: 13px;
      }

      .mobile-nav {
        height: 68px;
      }

      .mobile-nav a {
        height: 54px;
      }

      .mobile-nav .material-icons-round {
        font-size: 21px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Your Booking</div>
  </header>

  <!-- CART SUMMARY -->
  <section class="booking-summary">

    <h2>Your Booking</h2>

    <div id="cartItems" class="cart-items"></div>

    <div class="add-more-wrap">
      <a href="services.html" class="btn btn-outline">
        <span class="material-icons-round">add</span>
        Add more services
      </a>
    </div>

    <div class="total-row">
      <span>Total</span>
      <strong id="total">₦0</strong>
    </div>

  </section>


  <!-- CUSTOMER DETAILS -->
  <section class="booking-form">

    <h3>Your Details</h3>

    <input
      id="name"
      type="text"
      placeholder="Full Name"
      required
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
      required
    >

    <input
      id="phone"
      type="tel"
      placeholder="WhatsApp Number"
      required
    >

    <div class="datetime-row">

      <input
        id="date"
        type="date"
        required
      >

      <input
        id="time"
        type="time"
        required
      >

    </div>

    <button
      class="btn btn-primary"
      onclick="confirmBooking()"
    >
      Book Now
    </button>

    <p class="note">
      *Booking time subject to admin confirmation
    </p>

  </section>

</div>


<!-- =========================
     MOBILE BOTTOM NAV
========================== -->

<nav class="mobile-nav">

  <a href="index.html">
    <span class="material-icons-round">home</span>
    <small>Home</small>
  </a>

  <a href="booking.html" class="active">
    <span class="material-icons-round">event</span>
    <small>Booking</small>
  </a>

  <a href="saved.html">
    <span class="material-icons-round">favorite</span>
    <small>Saved</small>
  </a>

  <a id="messageAdmin" href="#">
    <span class="material-icons-round">chat</span>
    <small>Message</small>
  </a>

  <a href="profile.html">
    <span class="material-icons-round">person</span>
    <small>Profile</small>
  </a>

</nav>


<script>

/* ============================
   MOBILE NAV – ADMIN WHATSAPP
============================ */

(function bindAdminWhatsAppFromCatalog() {

  const msgBtn = document.getElementById("messageAdmin");

  if (!msgBtn) return;

  fetch("/catalog1.json")

    .then(res => {

      if (!res.ok) {
        throw new Error("Catalog not found");
      }

      return res.json();

    })

    .then(data => {

      const phone = data?.admin?.whatsapp;

      if (!phone) {
        throw new Error("Admin WhatsApp missing");
      }

      const cleanPhone = phone.replace(/\D/g, "");

      msgBtn.href = `https://wa.me/${cleanPhone}`;
      msgBtn.target = "_blank";

    })

    .catch(() => {

      msgBtn.href = "#";

      msgBtn.addEventListener("click", e => {

        e.preventDefault();

        alert("Admin WhatsApp not available yet.");

      });

    });

})();


/* ============================
   SAFARI DETECTION
============================ */

function isSafariBrowser() {

  const ua = navigator.userAgent;

  return (
    ua.includes("Safari") &&
    !ua.includes("Chrome") &&
    !ua.includes("Android")
  );

}


/* ============================
   SAFARI SEND BUTTON
============================ */

function showSafariSendButton(booking) {

  const existing =
    document.getElementById("safariSendWrap");

  if (existing) {
    existing.remove();
  }

  const wrapper =
    document.createElement("div");

  wrapper.id = "safariSendWrap";

  const btn =
    document.createElement("button");

  btn.className = "btn btn-primary";

  btn.textContent = "Send Booking to Admin";

  btn.onclick = () =>
    notifyAdminImmediately(booking);

  const note =
    document.createElement("p");

  note.className = "note";

  note.textContent =
    "Tap to notify admin on WhatsApp";

  wrapper.appendChild(btn);

  wrapper.appendChild(note);

  document
    .querySelector(".booking-form")
    .appendChild(wrapper);

}


/* ============================
   SERVICES API
============================ */

const SERVICES_API =
  "https://script.google.com/macros/s/AKfycbyruovbZRwQr2Smn-zfKQyMjHAKYS18wpU9Nk8rN0Mdvtblz5yuY9LGgk3a3IwREq59/exec?type=services";


const CART_KEY = "spaBookingCart";

let cart =
  JSON.parse(
    localStorage.getItem(CART_KEY)
  ) || [];

let SERVICES = [];


/* ============================
   LOAD SERVICES
============================ */

async function loadServicesAndSyncCart() {

  try {

    const res =
      await fetch(SERVICES_API);

    SERVICES =
      await res.json();

    cart = cart.filter(item =>
      SERVICES.some(
        s => s.id === item.id
      )
    );

    cart = cart.map(item => {

      const live =
        SERVICES.find(
          s => s.id === item.id
        );

      return {
        ...item,
        price: live.price
      };

    });

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

    renderCart();

  } catch (err) {

    console.error(
      "Failed to sync services",
      err
    );

    renderCart();

  }

}


/* ============================
   CART ELEMENTS
============================ */

const cartItemsEl =
  document.getElementById("cartItems");

const totalEl =
  document.getElementById("total");


/* ============================
   RENDER CART
============================ */

function renderCart() {

  cartItemsEl.innerHTML = "";

  if (!cart.length) {

    cartItemsEl.innerHTML =
      "<p class='empty'>No services selected yet.</p>";

    totalEl.textContent = "₦0";

    return;

  }

  let total = 0;

  cart.forEach((item, index) => {

    total += item.price;

    const row =
      document.createElement("div");

    row.className = "cart-item";

    row.innerHTML = `

      <div class="cart-left">
        <span>${item.name}</span>
      </div>

      <div class="cart-right">

        <strong>
          ₦${item.price.toLocaleString()}
        </strong>

        <button
          class="remove-btn"
          onclick="removeFromCart(${index})"
          aria-label="Remove service"
        >
          <span class="material-icons-round">
            close
          </span>
        </button>

      </div>

    `;

    cartItemsEl.appendChild(row);

  });

  totalEl.textContent =
    "₦" + total.toLocaleString();

}


/* =========================
   GLOBAL ADMIN CATALOG
========================= */

let PUBLIC_CATALOG = {

  admin: {
    whatsapp: null
  }

};


/* =========================
   LOAD ADMIN WHATSAPP
========================= */

fetch("/catalog1.json")

  .then(res => res.json())

  .then(data => {

    if (data?.admin?.whatsapp) {

      PUBLIC_CATALOG.admin.whatsapp =
        data.admin.whatsapp.replace(/\D/g, "");

      const msgBtn =
        document.getElementById(
          "messageAdmin"
        );

      if (msgBtn) {

        msgBtn.href =
          `https://wa.me/${PUBLIC_CATALOG.admin.whatsapp}`;

        msgBtn.target = "_blank";

      }

    }

  })

  .catch(() => {

    console.warn(
      "catalog1.json not found or invalid"
    );

  });


/* =========================
   WHATSAPP NOTIFY ADMIN
========================= */

function notifyAdmin(booking) {

  const phone =
    PUBLIC_CATALOG.admin.whatsapp;

  if (!phone) {

    alert(
      "Admin WhatsApp not available yet. Please try again."
    );

    return;

  }

  const message = `

📅 NEW BOOKING ALERT

👤 Name: ${booking.customer.name}
📞 Phone: ${booking.customer.phone}
📧 Email: ${booking.customer.email}

🧖 Services:
${booking.services}

🗓 Date: ${booking.date}
⏰ Time: ${booking.time}

💰 Total: ₦${booking.total.toLocaleString()}

`;

  window.open(

    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,

    "_blank"

  );

}


/* =========================
   CONFIRM BOOKING
========================= */

const FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSe6deSJ1KcJgDcRWqhuF8ZmUtgJNdB1vXapQtkmHlqUdEydow/formResponse";


function confirmBooking() {

  if (!cart.length) {

    alert(
      "Please select at least one service."
    );

    return;

  }


  const name =
    getValue("name");

  const email =
    getValue("email");

  const phone =
    getValue("phone");

  const date =
    getValue("date");

  const time =
    getValue("time");


  if (
    !name ||
    !email ||
    !phone ||
    !date ||
    !time
  ) {

    alert(
      "Fill all booking details."
    );

    return;

  }


  const total =
    cart.reduce(
      (sum, item) =>
        sum + item.price,
      0
    );


  const booking = {

    id:
      "bk_" + Date.now(),

    customer: {
      name,
      email,
      phone
    },

    services:
      cart.map(
        s => s.name
      ).join(", "),

    date,

    time,

    total,

    status:
      "submitted",

    createdAt:
      new Date().toISOString()

  };


  /* SAVE LOCALLY */

  const bookings =
    JSON.parse(
      localStorage.getItem(
        "spaBookings"
      ) || "[]"
    );

  bookings.push(booking);

  localStorage.setItem(
    "spaBookings",
    JSON.stringify(bookings)
  );


  /* =========================
     SEND TO GOOGLE FORM
  ========================= */

  const formData =
    new URLSearchParams();

  formData.append(
    "entry.1782671902",
    name
  );

  formData.append(
    "entry.429038329",
    email
  );

  formData.append(
    "entry.85535944",
    phone
  );

  formData.append(
    "entry.1834985643",
    booking.services
  );

  formData.append(
    "entry.58735690",
    date
  );

  formData.append(
    "entry.436380386",
    time
  );

  formData.append(
    "entry.2083144677",
    total
  );


  fetch(FORM_URL, {

    method: "POST",

    mode: "no-cors",

    body: formData

  });


  renderCart();


  alert(
    "Booking submitted successfully ✅"
  );


  /* WHATSAPP ADMIN */

  if (
    PUBLIC_CATALOG.admin.whatsapp
  ) {

    notifyAdmin(booking);

  }

}


/* =========================
   HELPERS
========================= */

function getValue(id) {

  return (
    document
      .getElementById(id)
      ?.value
      .trim() || ""
  );

}


/* =========================
   REMOVE FROM CART
========================= */

function removeFromCart(index) {

  cart.splice(index, 1);

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  renderCart();

}


/* =========================
   INIT
========================= */

renderCart();

loadServicesAndSyncCart();

</script>

</body>
</html>
