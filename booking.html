<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Booking | Pax & Pearl Body Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="container">

  <header class="header"><div class="logo">Your Booking</div></header>

  <!-- CART SUMMARY -->
  <section class="booking-summary">
    <h2>Your Booking</h2>
    <div id="cartItems" class="cart-items"></div>
    <div class="total-row"><span>Total</span><strong id="total">₦0</strong></div>
  </section>

  <!-- CUSTOMER DETAILS -->
  <section class="booking-form">
    <h3>Your Details</h3>
    <input id="name" type="text" placeholder="Full Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="phone" type="tel" placeholder="WhatsApp Number" required>
    <div class="datetime-row">
      <input id="date" type="date" required>
      <input id="time" type="time" required>
    </div>
    <button class="btn btn-primary" onclick="confirmBooking()">Book Now</button>
    <p class="note">*Booking time subject to admin confirmation</p>
  </section>

</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
  <a href="index.html"><span class="material-icons-round">home</span><small>Home</small></a>
  <a href="booking.html" class="active"><span class="material-icons-round">event</span><small>Booking</small></a>
  <a href="saved.html"><span class="material-icons-round">favorite</span><small>Saved</small></a>
  <a href="#" id="messageAdmin"><span class="material-icons-round">chat</span><small>Message</small></a>
  <a href="profile.html"><span class="material-icons-round">person</span><small>Profile</small></a>
</nav>

<style>.container{padding-bottom:90px;}</style>

<script>
const CART_KEY = "spaBookingCart";
let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];

const cartItemsEl = document.getElementById("cartItems");
const totalEl = document.getElementById("total");

/* RENDER CART */
function renderCart() {
  cartItemsEl.innerHTML = "";
  if (!cart.length) {
    cartItemsEl.innerHTML = "<p class='empty'>No services selected yet.</p>";
    totalEl.textContent = "₦0";
    return;
  }

  let total = 0;
  cart.forEach(item => {
    total += item.price;
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `<span>${item.name}</span><strong>₦${item.price.toLocaleString()}</strong>`;
    cartItemsEl.appendChild(row);
  });

  totalEl.textContent = "₦" + total.toLocaleString();
}

/* CONFIRM BOOKING */
function confirmBooking() {
  if (!cart.length) { alert("Please select at least one service."); return; }

  const name = getValue("name");
  const email = getValue("email");
  const phone = getValue("phone");
  const date = getValue("date");
  const time = getValue("time");

  if(!name||!email||!phone||!date||!time){alert("Fill all booking details.");return;}

  const total = cart.reduce((sum, item) => sum + item.price, 0);

  const booking = {
    id: "bk_" + Date.now(),
    customer: { name, email, phone },
    services: cart.map(s => s.name).join(", "),
    date, time,
    total,
    status: "pending",
    createdAt: new Date().toISOString()
  };

  const bookings = JSON.parse(localStorage.getItem("spaBookings") || "[]");
  bookings.push(booking);
  localStorage.setItem("spaBookings", JSON.stringify(bookings));

  // Clear cart
  cart = [];
  localStorage.removeItem(CART_KEY);

  alert("Booking submitted successfully ✅");

  // Show "Send to Admin" button
  showSendToAdminButton(booking);
}

/* =========================
   SHOW SEND TO ADMIN BUTTON
========================= */
function showSendToAdminButton(booking) {
  // Remove old button if exists
  const existingBtn = document.getElementById("sendToAdminBtn");
  if (existingBtn) existingBtn.remove();

  const btn = document.createElement("button");
  btn.id = "sendToAdminBtn";
  btn.className = "btn btn-primary";
  btn.textContent = "Send Booking to Admin";
  btn.onclick = () => notifyAdmin(booking);

  document.querySelector(".booking-form").appendChild(btn);
}


/* =========================
   PUBLIC CATALOG
========================= */
let PUBLIC_CATALOG = null;

fetch("/catalog1.json")
  .then(res => res.json())
  .then(data => {
    PUBLIC_CATALOG = data;

    const adminPhone = data?.admin?.whatsapp;
    const msgBtn = document.getElementById("messageAdmin");

    if (adminPhone && msgBtn) {
      msgBtn.href = `https://wa.me/${adminPhone}`;
      msgBtn.target = "_blank";
    }
  })
  .catch(() => {
    console.warn("catalog1.json not found");
  });

/* =========================
   WHATSAPP NOTIFY ADMIN
========================= */
function notifyAdmin(booking) {
  const phone = PUBLIC_CATALOG?.admin?.whatsapp;

  if (!phone) {
    alert("Admin WhatsApp not available.");
    return;
  }

  const message = `
New Booking 📅
Name: ${booking.customer.name}
Services: ${booking.services}
Total: ₦${booking.total.toLocaleString()}
Date: ${booking.date}
Time: ${booking.time}
Phone: ${booking.customer.phone}
`;

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}


/* =========================
   HELPERS
========================= */
function getValue(id) {
  return document.getElementById(id)?.value.trim() || "";
}

/* INIT */
renderCart();
</script>

</body>
</html>
