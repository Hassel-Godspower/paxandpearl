<script>
  // Example: get username dynamically (replace this with your actual logic)
   const profile = JSON.parse(localStorage.getItem("userProfile") || "{}");

  if (profile.name) {
    document.getElementById("user-name").textContent = `Hello ${profile.name} 👋`;
  } else {
    document.getElementById("user-name").textContent = "Hello 👋";
  }

  // Function to set greeting based on WAT time
  function setGreetingWAT() {
    const timeGreetingEl = document.getElementById('time-greeting');

    const now = new Date();
    const options = { hour: 'numeric', hour12: false, timeZone: 'Africa/Lagos' };
    const hour = parseInt(new Intl.DateTimeFormat('en-US', options).format(now), 10);

    let greetingText = '';

    if (hour >= 0 && hour < 12) {
      greetingText = 'Good Morning ☀️';
    } else if (hour >= 12 && hour <= 15) {
      greetingText = 'Good Afternoon ☀️';
    } else if (hour >= 16 && hour <= 23) {
      greetingText = 'Good Evening 🌙';
    }

    timeGreetingEl.textContent = greetingText;
  }

  // Run on page load
  setGreetingWAT();
</script>
