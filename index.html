<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

  <!-- =========================
       APP CONTAINER
  ========================== -->
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">Pax & Pearl Body Works</div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <h1>Relax. Refresh. Rejuvenate.</h1>
      <p>Book premium spa treatments with ease</p>
    </section>

    <!-- GREETING -->
    <section class="greeting">
      <h2>Good Morning 👋</h2>
    </section>

    <!-- PROMO -->
    <section class="promo-card">
      <h3>20% Off Haircut</h3>
      <button class="btn" onclick="location.href='services.html'">
        Book Now
      </button>
    </section>

    <!-- POPULAR SERVICES -->
    <section class="quick-services">
      <h3>Popular Services</h3>

      <div class="grid">
        <button onclick="goService('Haircut')">✂ Hair</button>
        <button onclick="goService('Facial')">🧖 Facial</button>
        <button onclick="goService('Massage')">💆 Massage</button>
      </div>
    </section>

    <!-- SERVICES LIST -->
    <section class="services-section">
      <h2>Our Services</h2>
      <div class="services" id="serviceList"></div>
    </section>

  </div>

  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->
  <nav class="bottom-nav">
    <a href="index.html">🏠</a>
    <a href="services.html">💆</a>
    <a href="booking.html">📅</a>
    <a href="profile.html">👤</a>
  </nav>

  <!-- =========================
       SCRIPTS
  ========================== -->
  <script src="js/data.js"></script>
  <script src="js/booking.js"></script>

</body>
</html>
