<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pax & Pearl Body Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

  <!-- =========================
       APP CONTAINER
  ========================== -->
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">Pax & Pearl Body Works</div>
      <p class="location">Lagos, Nigeria</p>
    </header>

    <!-- HERO -->
    <section class="hero">
      <h1>Relax. Refresh. Rejuvenate.</h1>
      <p>Book premium spa treatments with ease</p>
    </section>

    <!-- GREETING -->
    <section class="greeting">
      <h2 id="greeting">Hello 👋</h2>
      <p id="username">Paul</p>
    </section>


    <!-- PROMO -->
    <section class="promo-card">
      <h3>20% Off Haircut</h3>
      <button class="promo-btn" onclick="location.href='services.html'">
        Book Now
      </button>
    </section>

    <!-- POPULAR SERVICES -->
    <section class="quick-services">
      <h3>Popular Services</h3>

      <div class="grid">
        <button onclick="goService('Haircut')">✂ Hair</button>
        <button onclick="goService('Facial')">🧖 Facial</button>
        <button onclick="goService('Massage')">💆 Massage</button>
      </div>
    </section>

    <!-- SERVICES LIST -->
    <section class="services-section">
      <h2>Our Services</h2>
      <div class="services" id="serviceList"></div>
    </section>

  </div>

  <!-- =========================
       MOBILE BOTTOM NAV
  ========================== -->
  <nav class="mobile-nav">
    <a href="index.html" class="active">
      <span class="material-icons-round">home</span>
      <small>Home</small>
    </a>

    <a href="booking.html">
      <span class="material-icons-round">event</span>
      <small>Booking</small>
    </a>

    <a href="saved.html">
      <span class="material-icons-round">favorite</span>
      <small>Saved</small>
    </a>

    <a href="https://wa.me/234XXXXXXXXXX" target="_blank">
      <span class="material-icons-round">chat</span>
      <small>Message</small>
    </a>

    <a href="profile.html">
      <span class="material-icons-round">person</span>
      <small>Profile</small>
    </a>
  </nav>

  <!-- =========================
       SCRIPTS
  ========================== -->
  <script>
    function setGreetingAndUser() {
      const greetingEl = document.getElementById('greeting');
      const userEl = document.getElementById('username');
  
      const now = new Date();
      const hour = now.getHours();
  
      let greetingText;
      if (hour >= 5 && hour < 12) {
        greetingText = 'Good Morning,';
      } else if (hour >= 12 && hour < 17) {
        greetingText = 'Good Afternoon,';
      } else {
        greetingText = 'Good Evening,';
      }
  
      greetingEl.textContent = greetingText;
  
      // Replace later with real auth/user data
      const userName = localStorage.getItem('user_name') || 'Paul';
      userEl.textContent = userName;
    }
  
    setGreetingAndUser();
  </script>

  <script src="js/data.js"></script>
  <script src="js/booking.js"></script>

</body>
</html>
