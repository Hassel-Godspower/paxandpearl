<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; padding:16px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    section { margin:20px 0; }
    .card { padding:12px; border:1px solid #eee; border-radius:10px; margin-bottom:12px; }
    select, input, button, textarea {
      width:100%; padding:10px; margin-top:6px;
      border-radius:8px; border:1px solid #ddd;
    }
    button { background:#7b5cff; color:#fff; border:none; cursor:pointer; }
    textarea { resize:vertical; }
    .row { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <h2>Admin Dashboard</h2>
  <small id="headerWhatsApp" style="opacity:0.7;"></small>
  <button id="logoutBtn">Logout</button>
</header>

<hr>

<!-- BUSINESS STATS -->
<section id="stats">
  <div>
    <strong>Total Bookings:</strong>
    <span id="totalBookings">0</span>
  </div>
  <div>
    <strong>Total Revenue:</strong>
    ₦<span id="totalRevenue">0</span>
  </div>
  <div>
    <strong>Pending:</strong>
    <span id="pendingCount">0</span>
  </div>
  <div>
    <strong>Approved:</strong>
    <span id="approvedCount">0</span>
  </div>
</section>

<hr>

<!-- ADMIN WHATSAPP -->
<section>
  <h3>Admin WhatsApp</h3>
  <input id="adminPhone" placeholder="Admin WhatsApp Number">
  <button id="saveAdminPhone">Save WhatsApp</button>
</section>

<script>
const adminPhoneInput = document.getElementById("adminPhone");
const saveBtn = document.getElementById("saveAdminPhone");

function updateMessageButton() {
  // Update all nav buttons with ID messageAdmin
  document.querySelectorAll("#messageAdmin").forEach(btn => {
    const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
    if (savedProfile.phone) {
      btn.href = `https://wa.me/${savedProfile.phone}`;
      btn.target = "_blank";
      btn.classList.remove("disabled");
    } else {
      btn.href = "#";
      btn.classList.add("disabled");
    }
  });
}

// Load existing number
const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
if (savedProfile.phone) adminPhoneInput.value = savedProfile.phone;

// Save button click
if (saveBtn) {
  saveBtn.addEventListener("click", () => {
    const phone = adminPhoneInput.value.trim();
    if (!phone) return alert("Enter WhatsApp number");

    localStorage.setItem("adminProfile", JSON.stringify({ phone }));
    alert("Admin WhatsApp number saved");

    // Update nav button immediately
    updateMessageButton();
  });
}

// Initial button update
updateMessageButton();
</script>


<hr>

<!-- BOOKINGS -->
<section>
  <h3>Bookings</h3>
  <div id="bookings"></div>
</section>

<hr>

<!-- SERVICES -->
<section>
  <h3>Services & Pricing</h3>
  <div id="services"></div>
</section>

<script src="/admin-1993/admin.js"></script>

</body>
</html>
