<style>

.admin-layout {
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background:#0f172a;
  color:#fff;
  padding:20px;
  display:flex;
  flex-direction:column;
}

.sidebar .logo {
  font-size:18px;
  font-weight:700;
  margin-bottom:24px;
}

.sidebar nav {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav-btn {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:none;
  border:none;
  color:#cbd5f5;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

.nav-btn:hover,
.nav-btn.active {
  background:#1e293b;
  color:#fff;
}

.nav-btn .material-icons-round {
  font-size:20px;
}

/* MAIN */
.main-content {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

/* PAGE SWITCH */
.page {
  display:none;
}

.page.active {
  display:block;
}

/* =============================
   BASE
============================= */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f7f8fc;
  margin:0;
  padding:16px;
  color:#1f2937;
}

h2, h3 {
  margin:0 0 10px;
}

small { color:#6b7280; }

/* =============================
   HEADER
============================= */
header {
  background:#ffffff;
  padding:16px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.header-left h2 {
  font-size:20px;
}

.header-right {
  display:flex;
  gap:12px;
  align-items:center;
}

/* =============================
   BUTTONS
============================= */
.btn {
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.btn-primary {
  background:#7b5cff;
  color:#fff;
}

.btn-primary:hover {
  background:#6a4ee6;
}
  
.form-group {
  margin-top: 12px;
}

/* =============================
   STATS
============================= */
.stats {
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.stat-card {
  background:#ffffff;
  padding:14px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
}

.stat-card span {
  font-size:20px;
  font-weight:700;
}

/* =============================
   SECTIONS
============================= */
section {
  margin-top:24px;
  background:#ffffff;
  padding:16px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

/* =============================
   FORMS
============================= */
input, select, textarea {
  width:50%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-top:6px;
  font-size:14px;
}

textarea { resize:vertical; }

/* =============================
   CARDS
============================= */
.card {
  border:1px solid #f1f1f1;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  background:#fafafa;
}

/* =============================
   UTIL
============================= */
.row {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

a {
  color:#7b5cff;
  font-weight:600;
  text-decoration:none;
}
</style>
</head>

  <!-- MAIN -->

<!-- =============================

<!-- ADMIN WHATSAPP -->
<div class="page" data-page="settings">
<section>
  <h3>Admin WhatsApp</h3>

  <input id="adminPhone" placeholder="Admin WhatsApp Number">

  <div class="form-group">
    <button id="saveAdminPhone" class="btn btn-primary">
      Save WhatsApp
    </button>
  </div>
</section>

<script>
const adminPhoneInput = document.getElementById("adminPhone");
const saveBtn = document.getElementById("saveAdminPhone");

function updateMessageButton() {
  // Update all nav buttons with ID messageAdmin
  document.querySelectorAll("#messageAdmin").forEach(btn => {
    const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
    if (savedProfile.phone) {
      btn.href = `https://wa.me/${savedProfile.phone}`;
      btn.target = "_blank";
      btn.classList.remove("disabled");
    } else {
      btn.href = "#";
      btn.classList.add("disabled");
    }
  });
}

// Load existing number
const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
if (savedProfile.phone) adminPhoneInput.value = savedProfile.phone;

// Save button click
if (saveBtn) {
  saveBtn.addEventListener("click", () => {
    const phone = adminPhoneInput.value.trim();
    if (!phone) return alert("Enter WhatsApp number");

    localStorage.setItem("adminProfile", JSON.stringify({ phone }));
    alert("Admin WhatsApp number saved");

    // Update nav button immediately
    updateMessageButton();
  });
}

// Initial button update
updateMessageButton();
</script> 


<hr>

  <div id="bookings"></div>
</section>

<style> 
.calendar-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.calendar-controls {
  display:flex;
  gap:8px;
}

.calendar-grid {
  display:grid;
  grid-template-columns:80px repeat(7, 1fr);
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
}

.calendar-time {
  padding:8px;
  font-size:12px;
  color:#6b7280;
  border-bottom:1px solid #e5e7eb;
}

.calendar-cell {
  border-left:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb;
  padding:6px;
  min-height:60px;
}

.booking-block {
  background:#7b5cff;
  color:#fff;
  padding:6px 8px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:6px;
  cursor:pointer;
}

.booking-block.pending { background:#f59e0b; }
.booking-block.approved { background:#10b981; }
.booking-block.cancelled { background:#ef4444; }

</style>

  
<script>
/* ============================
   SPA CATALOG (LOCALSTORAGE)
============================ */
let catalog = JSON.parse(localStorage.getItem("spaCatalog"));

if (!catalog) {
  catalog = {
    meta: {
      adminWhatsApp: "",
      publishedAt: null
    },
    categories: [],
    services: []
  };
  localStorage.setItem("spaCatalog", JSON.stringify(catalog));
}


/* ============================
   DOM ELEMENTS
============================ */
const categoriesContainer = document.getElementById("categories");
const servicesContainer   = document.getElementById("services");

const categoryInput = document.getElementById("categoryName");
const addCategoryBtn = document.getElementById("addCategory");

const serviceNameInput = document.getElementById("serviceName");
const serviceDescriptionInput = document.getElementById("serviceDescription");
const servicePriceInput = document.getElementById("servicePrice");
const serviceDurationInput = document.getElementById("serviceDuration");
const serviceCategorySelect = document.getElementById("serviceCategory");
const addServiceBtn = document.getElementById("addService");

/* ============================
   INITIAL RENDER
============================ */
renderCategories();
renderServices();
refreshCategorySelect();

/* ============================
   CATEGORY LOGIC
============================ */
addCategoryBtn.addEventListener("click", () => {
  const name = categoryInput.value.trim();
  if (!name) return alert("Enter category name");

  const id = name.toLowerCase().replace(/\s+/g, "-");

  if (catalog.categories.some(c => c.id === id)) {
    return alert("Category already exists");
  }

  catalog.categories.push({ id, name });
  persistCatalog();

  categoryInput.value = "";
  renderCategories();
  refreshCategorySelect();
  alert("Category added ✅");
});

function renderCategories() {
  categoriesContainer.innerHTML = "";

  if (!catalog.categories.length) {
    categoriesContainer.innerHTML = "<p>No categories yet.</p>";
    return;
  }

  catalog.categories.forEach(cat => {
    categoriesContainer.insertAdjacentHTML(
      "beforeend",
      `<div class="card"><strong>${cat.name}</strong></div>`
    );
  });
}

/* ============================
   SERVICE LOGIC
============================ */
addServiceBtn.addEventListener("click", () => {
  const name = serviceNameInput.value.trim();
  const description = serviceDescriptionInput.value.trim();
  const price = Number(servicePriceInput.value);
  const duration = Number(serviceDurationInput.value);
  const category = serviceCategorySelect.value;

  if (!name || !description || !price || !duration || !category) {
    return alert("Fill all service fields");
  }

  catalog.services.push({
    id: "svc_" + Date.now(),
    name,
    description,
    price,
    duration,
    category,
    order: catalog.services.length
  });

  persistCatalog();

  serviceNameInput.value = "";
  serviceDescriptionInput.value = "";
  servicePriceInput.value = "";
  serviceDurationInput.value = "";

  renderServices();
  alert("Service added ✅");
});

function renderServices() {
  servicesContainer.innerHTML = "";

  if (!catalog.services.length) {
    servicesContainer.innerHTML = "<p>No services yet.</p>";
    return;
  }

  catalog.services
    .sort((a, b) => a.order - b.order)
    .forEach(service => {
      servicesContainer.insertAdjacentHTML(
        "beforeend",
        `
        <div class="card">
          <strong>${service.name}</strong><br>
          <small>${service.description}</small><br>
          ₦${service.price.toLocaleString()} • ${service.duration} mins
        </div>
        `
      );
    });
}

/* ============================
   CATEGORY SELECT
============================ */
function refreshCategorySelect() {
  serviceCategorySelect.innerHTML = "";

  catalog.categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.name;
    serviceCategorySelect.appendChild(opt);
  });
}

function persistCatalog() {
  localStorage.setItem("spaCatalog", JSON.stringify(catalog));
}
</script> 
  
<script>
function renderBookings() {
  const container = document.getElementById("bookings");
  container.innerHTML = "";

  if (!bookings.length) {
    container.innerHTML = "<p>No bookings yet.</p>";
    return;
  }

  bookings.forEach(b => {
    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="card">
        <strong>${b.name}</strong><br>
        <small>${b.services}</small><br>
        📅 ${b.date} • ⏰ ${b.time}<br>
        💰 ₦${b.total.toLocaleString()}<br><br>

        <select onchange="updateStatus('${b.id}', this.value)">
          <option ${b.status === "Pending" ? "selected" : ""}>Pending</option>
          <option ${b.status === "Approved" ? "selected" : ""}>Approved</option>
          <option ${b.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
        </select>

        <button class="btn btn-primary"
          onclick="approveBooking('${b.id}')">
          WhatsApp Customer
        </button>
      </div>
      `
    );
  });
}
</script>
<script>
function updateStatus(id, status) {
  bookingStatus[id] = status;
  localStorage.setItem("bookingStatus", JSON.stringify(bookingStatus));
  updateStats();
}

function approveBooking(id) {
  const booking = bookings.find(b => b.id === id);
  if (!booking) return;

  updateStatus(id, "Approved");

  const phone = booking.phone.replace(/\D/g, "");

  const msg = `
✅ BOOKING APPROVED

Hello ${booking.name},

Your booking for:
${booking.services}

📅 ${booking.date}
⏰ ${booking.time}

has been CONFIRMED.

We look forward to seeing you 💆🏽‍♀️✨
`;

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}
</script>

<script>
let currentView = "week";

function changeView(view) {
  currentView = view;
  renderCalendar();
}

function renderCalendar() {
  const container = document.getElementById("calendarContainer");
  container.innerHTML = "";

  if (!bookings.length) {
    container.innerHTML = "<p>No bookings yet.</p>";
    return;
  }

  if (currentView === "list") {
    renderListView(container);
  } else {
    renderWeekView(container);
  }
}

/* ==========================
   WEEK VIEW (IMAGE-LIKE)
========================== */
function renderWeekView(container) {
  const grid = document.createElement("div");
  grid.className = "calendar-grid";

  // Header row
  grid.appendChild(document.createElement("div"));
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d => {
    const h = document.createElement("div");
    h.className = "calendar-time";
    h.innerHTML = `<strong>${d}</strong>`;
    grid.appendChild(h);
  });

  // Time slots
  for (let hour = 9; hour <= 18; hour++) {
    const time = document.createElement("div");
    time.className = "calendar-time";
    time.textContent = `${hour}:00`;
    grid.appendChild(time);

    for (let d = 0; d < 7; d++) {
      const cell = document.createElement("div");
      cell.className = "calendar-cell";

      bookings
        .filter(b => parseInt(b.time) === hour)
        .forEach(b => {
          const block = document.createElement("div");
          block.className =
            `booking-block ${b.status.toLowerCase()}`;
          block.innerHTML = `
            <strong>${b.name}</strong><br>
            ${b.services}
          `;
          block.onclick = () => showBookingPopup(b);
          cell.appendChild(block);
        });

      grid.appendChild(cell);
    }
  }

  container.appendChild(grid);
}

/* ==========================
   LIST VIEW
========================== */
function renderListView(container) {
  bookings.forEach(b => {
    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="card">
        <strong>${b.name}</strong><br>
        ${b.services}<br>
        📅 ${b.date} • ⏰ ${b.time}<br>
        <span class="booking-block ${b.status.toLowerCase()}">
          ${b.status}
        </span>
      </div>
      `
    );
  });
}

/* ==========================
   POPUP
========================== */
function showBookingPopup(b) {
  alert(
    `BOOKING DETAILS\n\n` +
    `${b.name}\n` +
    `${b.services}\n` +
    `${b.date} ${b.time}\n` +
    `₦${b.total.toLocaleString()}\n` +
    `Status: ${b.status}`
  );
}
</script>

  
<script>
/* =========================
   GOOGLE SHEETS CSV
========================= */
const SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVGEisgmXeGP4Z9IjEwloNdAdTfgpFy-0cNF8VWhONeImOzO-OMVrR4d26cqgK6Ml8njsM4dm4IYur/pub?output=csv ";

let bookings = [];
let bookingStatus = JSON.parse(localStorage.getItem("bookingStatus") || "{}");

/* =========================
   LOAD BOOKINGS
========================= */
fetch(SHEET_CSV_URL)
  .then(res => res.text())
  .then(csv => {
    const rows = csv.split("\n").slice(1);
    bookings = rows
      .map(row => {
        const cols = row.split(",");
        if (!cols[1]) return null;

        const id = "bk_" + cols[0].replace(/\D/g, "");

        return {
          id,
          timestamp: cols[0],
          name: cols[1],
          email: cols[2],
          phone: cols[3],
          services: cols[4],
          date: cols[5],
          time: cols[6],
          total: Number(cols[7]) || 0,
          status: bookingStatus[id] || "Pending"
        };
      })
      .filter(Boolean);

    renderBookings();
    updateStats();
    renderCalendar();
  });
</script>  
<script>
function updateStats() {
  document.getElementById("totalBookings").textContent = bookings.length;

  const revenue = bookings.reduce((sum, b) => sum + b.total, 0);
  document.getElementById("totalRevenue").textContent =
    revenue.toLocaleString();

  document.getElementById("pendingCount").textContent =
    bookings.filter(b => b.status === "Pending").length;

  document.getElementById("approvedCount").textContent =
    bookings.filter(b => b.status === "Approved").length;
}
</script>

<script>
function publishCatalog() {
  const data = JSON.stringify(catalog, null, 2);

  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "catalog.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  alert(
    "catalog.json downloaded.\n\n" +
    "Upload it to your GitHub repo root and deploy to make services public."
  );
}
</script>

<script>
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));

    btn.classList.add("active");
    document.querySelector(`.page[data-page="${btn.dataset.page}"]`).classList.add("active");
  });
});
</script>
