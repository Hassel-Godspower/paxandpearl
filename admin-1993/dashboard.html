<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<style>
/* =============================
   BASE
============================= */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f7f8fc;
  margin:0;
  padding:16px;
  color:#1f2937;
}

h2, h3 {
  margin:0 0 10px;
}

small { color:#6b7280; }

/* =============================
   HEADER
============================= */
header {
  background:#ffffff;
  padding:16px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.header-left h2 {
  font-size:20px;
}

.header-right {
  display:flex;
  gap:12px;
  align-items:center;
}

/* =============================
   BUTTONS
============================= */
.btn {
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.btn-primary {
  background:#7b5cff;
  color:#fff;
}

.btn-primary:hover {
  background:#6a4ee6;
}
  
.form-group {
  margin-top: 12px;
}

/* =============================
   STATS
============================= */
.stats {
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.stat-card {
  background:#ffffff;
  padding:14px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
}

.stat-card span {
  font-size:20px;
  font-weight:700;
}

/* =============================
   SECTIONS
============================= */
section {
  margin-top:24px;
  background:#ffffff;
  padding:16px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

/* =============================
   FORMS
============================= */
input, select, textarea {
  width:50%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-top:6px;
  font-size:14px;
}

textarea { resize:vertical; }

/* =============================
   CARDS
============================= */
.card {
  border:1px solid #f1f1f1;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  background:#fafafa;
}

/* =============================
   UTIL
============================= */
.row {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

a {
  color:#7b5cff;
  font-weight:600;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- =============================
     HEADER
============================= -->
<header>
  <div class="header-left">
    <h2>Admin Dashboard</h2>
    <small id="headerWhatsApp"></small>
  </div>
  
  <div class="header-right">
    <button id="logoutBtn" class="btn btn-primary">Logout</button>
  </div>
</header>

<!-- =============================
     STATS
============================= -->
<div class="stats">
  <div class="stat-card">
    <small>Total Bookings</small>
    <span id="totalBookings">0</span>
  </div>

  <div class="stat-card">
    <small>Total Revenue</small>
    ₦<span id="totalRevenue">0</span>
  </div>

  <div class="stat-card">
    <small>Pending</small>
    <span id="pendingCount">0</span>
  </div>

  <div class="stat-card">
    <small>Approved</small>
    <span id="approvedCount">0</span>
  </div>
</div>
  
</section>
  <section>
  <h3>Revenue by Category</h3>
  <div id="revenueByCategory"></div>
</section>

<hr>

<!-- ADMIN WHATSAPP -->
<section>
  <h3>Admin WhatsApp</h3>

  <input id="adminPhone" placeholder="Admin WhatsApp Number">

  <div class="form-group">
    <button id="saveAdminPhone" class="btn btn-primary">
      Save WhatsApp
    </button>
  </div>
</section>

<script>
const adminPhoneInput = document.getElementById("adminPhone");
const saveBtn = document.getElementById("saveAdminPhone");

function updateMessageButton() {
  // Update all nav buttons with ID messageAdmin
  document.querySelectorAll("#messageAdmin").forEach(btn => {
    const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
    if (savedProfile.phone) {
      btn.href = `https://wa.me/${savedProfile.phone}`;
      btn.target = "_blank";
      btn.classList.remove("disabled");
    } else {
      btn.href = "#";
      btn.classList.add("disabled");
    }
  });
}

// Load existing number
const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
if (savedProfile.phone) adminPhoneInput.value = savedProfile.phone;

// Save button click
if (saveBtn) {
  saveBtn.addEventListener("click", () => {
    const phone = adminPhoneInput.value.trim();
    if (!phone) return alert("Enter WhatsApp number");

    localStorage.setItem("adminProfile", JSON.stringify({ phone }));
    alert("Admin WhatsApp number saved");

    // Update nav button immediately
    updateMessageButton();
  });
}

// Initial button update
updateMessageButton();
</script>


<hr>

<!-- BOOKINGS -->
<section>
  <h3>Bookings</h3>
  <div id="bookings"></div>
</section>

<hr>

<!-- SERVICES -->
<section>
  <h3>Services & Pricing</h3>
  <div id="services"></div>
  
  <section>
    <h3>Create Category</h3>
    <input id="categoryName" placeholder="Category name (e.g. Massage)">
    <button class="btn btn-primary" id="addCategory">Add Category</button>
  </section>
  
  <section>
  <h3>Create Service</h3>

  <input id="serviceName" placeholder="Service name">

  <textarea
    id="serviceDescription"
    placeholder="Service description (e.g. benefits, process, who it's for)"
    rows="3"
  ></textarea>

  <input id="servicePrice" type="number" placeholder="Price (₦)">

  <select id="serviceCategory"></select>

  <input id="serviceDuration" type="number" placeholder="Duration (minutes)">

  <button class="btn btn-primary" id="addService">Add Service</button>
</section>

  
<script src="/admin-1993/admin.js"></script>

</body>
</html>
