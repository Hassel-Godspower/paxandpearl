<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<style>
/* =============================
   BASE
============================= */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f7f8fc;
  margin:0;
  padding:16px;
  color:#1f2937;
}

h2, h3 {
  margin:0 0 10px;
}

small { color:#6b7280; }

/* =============================
   HEADER
============================= */
header {
  background:#ffffff;
  padding:16px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.header-left h2 {
  font-size:20px;
}

.header-right {
  display:flex;
  gap:12px;
  align-items:center;
}

/* =============================
   BUTTONS
============================= */
.btn {
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.btn-primary {
  background:#7b5cff;
  color:#fff;
}

.btn-primary:hover {
  background:#6a4ee6;
}
  
.form-group {
  margin-top: 12px;
}

/* =============================
   STATS
============================= */
.stats {
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.stat-card {
  background:#ffffff;
  padding:14px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
}

.stat-card span {
  font-size:20px;
  font-weight:700;
}

/* =============================
   SECTIONS
============================= */
section {
  margin-top:24px;
  background:#ffffff;
  padding:16px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

/* =============================
   FORMS
============================= */
input, select, textarea {
  width:50%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-top:6px;
  font-size:14px;
}

textarea { resize:vertical; }

/* =============================
   CARDS
============================= */
.card {
  border:1px solid #f1f1f1;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  background:#fafafa;
}

/* =============================
   UTIL
============================= */
.row {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

a {
  color:#7b5cff;
  font-weight:600;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- =============================
     HEADER
============================= -->
<header>
  <div class="header-left">
    <h2>Admin Dashboard</h2>
    <small id="headerWhatsApp"></small>
  </div>
  
  <div class="header-right">
    <button id="logoutBtn" class="btn btn-primary">Logout</button>
  </div>
</header>

<!-- =============================
     STATS
============================= -->
<div class="stats">
  <div class="stat-card">
    <small>Total Bookings</small>
    <span id="totalBookings">0</span>
  </div>

  <div class="stat-card">
    <small>Total Revenue</small>
    ₦<span id="totalRevenue">0</span>
  </div>

  <div class="stat-card">
    <small>Pending</small>
    <span id="pendingCount">0</span>
  </div>

  <div class="stat-card">
    <small>Approved</small>
    <span id="approvedCount">0</span>
  </div>
</div>
  
</section>
  <section>
  <h3>Revenue by Category</h3>
  <div id="revenueByCategory"></div>
</section>

<hr>

<!-- ADMIN WHATSAPP -->
<section>
  <h3>Admin WhatsApp</h3>

  <input id="adminPhone" placeholder="Admin WhatsApp Number">

  <div class="form-group">
    <button id="saveAdminPhone" class="btn btn-primary">
      Save WhatsApp
    </button>
  </div>
</section>

<script>
const adminPhoneInput = document.getElementById("adminPhone");
const saveBtn = document.getElementById("saveAdminPhone");

function updateMessageButton() {
  // Update all nav buttons with ID messageAdmin
  document.querySelectorAll("#messageAdmin").forEach(btn => {
    const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
    if (savedProfile.phone) {
      btn.href = `https://wa.me/${savedProfile.phone}`;
      btn.target = "_blank";
      btn.classList.remove("disabled");
    } else {
      btn.href = "#";
      btn.classList.add("disabled");
    }
  });
}

// Load existing number
const savedProfile = JSON.parse(localStorage.getItem("adminProfile") || "{}");
if (savedProfile.phone) adminPhoneInput.value = savedProfile.phone;

// Save button click
if (saveBtn) {
  saveBtn.addEventListener("click", () => {
    const phone = adminPhoneInput.value.trim();
    if (!phone) return alert("Enter WhatsApp number");

    localStorage.setItem("adminProfile", JSON.stringify({ phone }));
    alert("Admin WhatsApp number saved");

    // Update nav button immediately
    updateMessageButton();
  });
}

// Initial button update
updateMessageButton();
</script> 


<hr>

<!-- BOOKINGS -->
<section>
  <h3>Bookings</h3>
  <div id="bookings"></div>
</section>

<hr>

<!-- SERVICES -->
<section>
  <h3>Services & Pricing</h3>

  <!-- SAVED SERVICES -->
  <section>
    <h3>Saved Services</h3>
    <div id="services"></div>
  </section>

  <!-- SAVED CATEGORIES -->
  <section>
    <h3>Saved Categories</h3>
    <div id="categories"></div>
  </section>

  <!-- CREATE CATEGORY -->
  <section>
    <h3>Create Category</h3>
    <input id="categoryName" placeholder="Category name (e.g. Massage)">
    <button class="btn btn-primary" id="addCategory">Add Category</button>
  </section>

  <!-- CREATE SERVICE -->
  <section>
    <h3>Create Service</h3>

    <input id="serviceName" placeholder="Service name">

    <textarea
      id="serviceDescription"
      placeholder="Service description (e.g. benefits, process, who it's for)"
      rows="3"
    ></textarea>

    <input id="servicePrice" type="number" placeholder="Price (₦)">

    <select id="serviceCategory"></select>

    <input id="serviceDuration" type="number" placeholder="Duration (minutes)">

    <button class="btn btn-primary" id="addService">Add Service</button>
  </section>
</section>
  
<div
<button class="btn btn-primary" onclick="publishCatalog()">
  Publish Services
</button>
</div>

<script>
/* ============================
   SPA CATALOG (LOCALSTORAGE)
============================ */
let catalog = JSON.parse(localStorage.getItem("spaCatalog"));

if (!catalog) {
  catalog = {
    meta: {
      adminWhatsApp: "",
      publishedAt: null
    },
    categories: [],
    services: []
  };
  localStorage.setItem("spaCatalog", JSON.stringify(catalog));
}


/* ============================
   DOM ELEMENTS
============================ */
const categoriesContainer = document.getElementById("categories");
const servicesContainer   = document.getElementById("services");

const categoryInput = document.getElementById("categoryName");
const addCategoryBtn = document.getElementById("addCategory");

const serviceNameInput = document.getElementById("serviceName");
const serviceDescriptionInput = document.getElementById("serviceDescription");
const servicePriceInput = document.getElementById("servicePrice");
const serviceDurationInput = document.getElementById("serviceDuration");
const serviceCategorySelect = document.getElementById("serviceCategory");
const addServiceBtn = document.getElementById("addService");

/* ============================
   INITIAL RENDER
============================ */
renderCategories();
renderServices();
refreshCategorySelect();

/* ============================
   CATEGORY LOGIC
============================ */
addCategoryBtn.addEventListener("click", () => {
  const name = categoryInput.value.trim();
  if (!name) return alert("Enter category name");

  const id = name.toLowerCase().replace(/\s+/g, "-");

  if (catalog.categories.some(c => c.id === id)) {
    return alert("Category already exists");
  }

  catalog.categories.push({ id, name });
  persistCatalog();

  categoryInput.value = "";
  renderCategories();
  refreshCategorySelect();
  alert("Category added ✅");
});

function renderCategories() {
  categoriesContainer.innerHTML = "";

  if (!catalog.categories.length) {
    categoriesContainer.innerHTML = "<p>No categories yet.</p>";
    return;
  }

  catalog.categories.forEach(cat => {
    categoriesContainer.insertAdjacentHTML(
      "beforeend",
      `<div class="card"><strong>${cat.name}</strong></div>`
    );
  });
}

/* ============================
   SERVICE LOGIC
============================ */
addServiceBtn.addEventListener("click", () => {
  const name = serviceNameInput.value.trim();
  const description = serviceDescriptionInput.value.trim();
  const price = Number(servicePriceInput.value);
  const duration = Number(serviceDurationInput.value);
  const category = serviceCategorySelect.value;

  if (!name || !description || !price || !duration || !category) {
    return alert("Fill all service fields");
  }

  catalog.services.push({
    id: "svc_" + Date.now(),
    name,
    description,
    price,
    duration,
    category,
    order: catalog.services.length
  });

  persistCatalog();

  serviceNameInput.value = "";
  serviceDescriptionInput.value = "";
  servicePriceInput.value = "";
  serviceDurationInput.value = "";

  renderServices();
  alert("Service added ✅");
});

function renderServices() {
  servicesContainer.innerHTML = "";

  if (!catalog.services.length) {
    servicesContainer.innerHTML = "<p>No services yet.</p>";
    return;
  }

  catalog.services
    .sort((a, b) => a.order - b.order)
    .forEach(service => {
      servicesContainer.insertAdjacentHTML(
        "beforeend",
        `
        <div class="card">
          <strong>${service.name}</strong><br>
          <small>${service.description}</small><br>
          ₦${service.price.toLocaleString()} • ${service.duration} mins
        </div>
        `
      );
    });
}

/* ============================
   CATEGORY SELECT
============================ */
function refreshCategorySelect() {
  serviceCategorySelect.innerHTML = "";

  catalog.categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.name;
    serviceCategorySelect.appendChild(opt);
  });
}

function persistCatalog() {
  localStorage.setItem("spaCatalog", JSON.stringify(catalog));
}
</script> 
  

<script>
function publishCatalog() {
  const data = JSON.stringify(catalog, null, 2);

  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "catalog.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  alert(
    "catalog.json downloaded.\n\n" +
    "Upload it to your GitHub repo root and deploy to make services public."
  );
}
</script>

</body>
</html>
